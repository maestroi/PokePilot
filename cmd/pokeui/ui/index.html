<title>PokéFarm Console</title>
<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}body{font-family:var(--sans);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button,input,select{touch-action:manipulation}:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}[hidden]{display:none!important}

#banner{padding:10px 16px;color:#fff;background:var(--red-dark);font-weight:700}#queue{background:var(--surface);border-bottom:1px solid var(--line);padding:16px}#queue h2{margin:0 0 12px;font-size:18px}#queue .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px 12px}#queue label.run-id{grid-column:span 2}#queue label.goal-field{grid-column:span 2}label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}label[hidden],.scripted-only[hidden],.llm-only[hidden],.endless-only[hidden],.llm-starter-opt[hidden]{display:none!important}input,select{width:100%;background:var(--bg-deep);border:1px solid var(--line);border-radius:8px;padding:9px 10px;text-transform:none;letter-spacing:normal;color:var(--ink)}input[readonly]{color:var(--muted);cursor:default}.check{flex-direction:row;align-items:center;gap:8px;align-self:end;min-height:40px}.check input{width:auto}.form-row{display:flex;gap:12px;align-items:center;margin-top:12px}#form-error{color:var(--err-ink);font-weight:700}
main{padding:16px;max-width:1920px;margin:0 auto}.workspace{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}.run-rail,#watch,.ops-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.run-rail{position:sticky;top:82px;max-height:calc(100vh - 98px);overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr)}.rail-head{padding:12px 14px;border-bottom:1px solid var(--line)}.rail-head h2,.section-h{margin:0;font-size:18px;color:var(--blue-dark)}.rail-note{color:var(--muted);font-size:12px;margin-top:3px}#live{padding:8px;overflow:auto;display:grid;gap:8px;align-content:start}.empty{color:var(--muted);padding:12px;margin:0}

var(--muted);font:12px/1.4 var(--mono);text-align:right}.map-scroll{width:72%;max-width:320px;margin:0 auto;display:grid;place-items:center}#detail-map{display:block;image-rendering:pixelated;image-rendering:crisp-edges}.map-legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:8px 2px 0;color:var(--muted);font-size:12px}.map-legend b{color:var(--ink);font-family:var(--mono)}.watch-side{padding:12px 14px;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--surface)}#detail-chips{flex:none;position:sticky;top:0;z-index:2;background:var(--surface);padding-bottom:8px}#detail-body{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto minmax(0,1fr);grid-auto-rows:auto;gap:8px;align-items:stretch;align-content:stretch;overflow:hidden}#detail-party{flex:none;margin-top:8px}#detail-party:empty{display:none}.block{margin:0;padding:10px;background:var(--raised);border:1px solid var(--line);border-radius:9px;min-width:0}#detail-body>.block{height:100%;min-height:0}.block.scroll{max-height:min(14rem,36vh);min-height:0;overflow:auto}#detail-body>.block.scroll{max-height:none}.block h3{margin:0 0 7px;color:var(--blue-dark);font-size:12px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;background:var(--raised);z-index:1}.kv{display:grid;grid-template-columns:6.2rem minmax(0,1fr);gap:4px 8px;margin:0;font-size:15px}.kv dt,.plan-k,.prow span:first-child{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}.trace{margin:5px 0 0;color:var(--green);white-space:pre-wrap;max-height:110px;overflow:auto;font:12px/1.45 var(--mono)}.plan-k{margin-top:5px;font-size:12px;text-transform:uppercase;letter-spacing:.04em}.plan-q{margin:4px 0 0;white-space:pre-wrap;color:var(--ink);font:15px/1.45 var(--mono)}.plan-d,.plan-wait{margin:4px 0 0;font-size:15px}.plan-d{color:var(--green);font-weight:700}.plan-wait{color:var(--muted)}.plan-raw{margin-top:6px}.plan-raw summary{cursor:pointer; .ops{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.ops-card{overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.28)}.ops-card.history{grid-column:1/-1}.ops-card summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:800;font-size:18px;color:var(--blue-dark);background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}.ops-card summary::-webkit-details-marker{display:none}.ops-card summary:before{content:"▸";color:var(--red)}.ops-card[open] summary:before{transform:rotate(90deg)}.ops-inner{padding:10px 12px 12px;max-height:360px;overflow:auto}.history .ops-inner{max-height:none;overflow:visible;display:grid;gap:10px}#workers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}.worker{min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--raised);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:5px 8px;align-items:center;font-size:15px}.worker .addr,.worker .job{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.worker .addr{font-family:var(--mono);font-size:12px}.worker .ver,.worker .ago{color:var(--muted);font:12px/1.4 var(--mono)}.worker .job{grid-column:2/-1}.ver-summary{color:var(--muted);font-size:12px;margin:0 0 8px}#failures{display:grid;gap:8px}.fail-card{padding:10px 12px;border:1px solid #5a3535;border-radius:8px;background:#2a1c1e;display:grid;gap:4px}.fail-pat{font-size:15px;font-weight:800;color:#f0a8a2}.fail-ex{font-size:12px;color:#cbb4b0;font-family:var(--mono)}.fail-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.fail-act{border:1px solid var(--line);background:var(--surface-3);color:var(--blue);border-radius:6px;padding:5px 8px;font-size:12px;font-weight:700}.section-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.filters{display:flex;flex-wrap:wrap;gap:6px 10px}.filter-group{display:flex;flex-wrap:wrap;align-items:center;gap:5px}.filter-group>span{color:var(--muted);font-size:12px}.filter{border:1px solid var(--line);border-radius:999px;background:var(--raised);color:var(--ink);padding:5px 10px;font-size:12px}.filter[aria-pressed="true"]{background:var(--info-bg);border-color:#4a6484;color:var(--info-ink)}#history{display:grid}.hist-row{display:grid;grid-template-columns:minmax(0,1fr) auto;border-bottom:1px solid var(--line)}.hist-row:nth-child(even){background:var(--surface-2)}.hist-row.selected{background:#2a334c}.hist-row:hover{background:var(--surface-3)}.hist {grid-template-columns:minmax(9.5rem,.9fr) minmax(10rem,1.1fr) minmax(9rem,1fr) minmax(12rem,1.4fr);width:100%;min-width:0;display:grid;gap:8px 12px;align-items:center;border:0;background:transparent;text-align:left;padding:8px;font-size:14px;line-height:1.35}.hist-who{display:grid;gap:2px;min-width:0}.hist-when{color:var(--muted);font-size:12px}.hist-id{font:700 13px/1.3 var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--blue)}.hist-where{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--ink)}.hist-out{display:grid;gap:4px;justify-items:start;min-width:0}.hist-outcome{max-width:none;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal}.hist-del{border:0;background:transparent;color:var(--err-ink);padding:8px;font-size:12px}.pager{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:15px}.pager-btn{border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:6px;padding:6px 10px}.pager-btn:disabled{opacity:.4;cursor:default}
@media(max-width:1280px){.watch-grid{grid-template-columns:minmax(240px,.8fr) minmax(0,1.3fr)}#detail-body{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:960px){.workspace{grid-template-columns:1fr}.run-rail{position:static;max-height:none}#live{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));max-height:320px}.ops{grid-template-columns:1fr}.ops-card.history{grid-column:auto}}@media(max-width:700px){.bar{gap:9px;padding:8px 9px 12px}.tagline{display:none}.counts{order:3;flex-basis:100%;gap:7px}#versions{display:none}.queue-btn{padding:8px 10px}main{padding:9px}.workspace{gap:9px}#live{grid-template-columns:1fr;max-height:none}.watch-grid{grid-template-columns:1fr}#watch{height:auto;max-height:none}.watch-screens{border-right:0;border-bottom:1px solid var(--line)}#detail-body{grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:auto;flex:none;min-height:0;overflow:auto;align-content:start}.watch-side{padding:9px;min-height:0;overflow:visible}.block.scroll{max-height:18rem}#detail-body>.block.scroll{max-height:18rem}.party-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hist{grid-template-columns:minmax(0,1fr);gap:4px}.hist-out{justify-content:flex-start}#queue .fields{grid-template-columns:1fr}#queue label.run-id,#queue label.goal-field{grid-column:auto}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<style>
.history-list{max-height:min(38vh,380px);overflow:auto}
.history-list .hist-row:last-child{border-bottom:0}
.history .section-top,.history .pager{margin:0}
.inspect{border-top:1px solid var(--line);padding-top:12px}
.inspect-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.inspect-head h3{margin:0;font-size:15px;color:var(--blue-dark)}
.inspect-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inspect-controls label{flex-direction:row;align-items:center;gap:8px;margin:0;text-transform:none;letter-spacing:0;font-weight:600;font-size:13px;color:var(--muted)}
.inspect-controls select{width:auto;min-width:16rem;max-width:min(36rem,70vw);padding:6px 8px}
.inspect-grid{display:grid;gap:8px}
.inspect-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.inspect-status{color:var(--muted);font-size:13px;word-break:break-word;margin:8px 0 0}
.inspect video{width:100%;max-height:360px;margin-top:8px;border-radius:8px;background:#0c1018;image-rendering:pixelated}
.inspect-table-wrap{overflow:auto}
.inspect table{width:100%;border-collapse:collapse;font-size:13px}
.inspect th,.inspect td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.inspect th{color:var(--muted);font-size:12px;font-weight:700}
.inspect td:first-child{white-space:normal;word-break:break-word}
.inspect a{color:var(--blue)}
.inspect .plan-raw{margin-top:10px}
.inspect .empty{padding:8px 0}
@media(max-width:760px){.inspect-grid{grid-template-columns:1fr}.inspect-controls,.inspect-controls select{width:100%;min-width:0}.history-list{max-height:min(50vh,420px)}}
</style>

<body>
<header class="bar"><div class="brand"><span class="ball" aria-hidden="true"></span><div><h1>PokéFarm</h1><div class="tagline">distributed Pokémon runner console</div></div></div><div class="counts" aria-live="polite"><span><b id="n-running">0</b> running</span><span><b id="n-queued">0</b> queued</span><span><b id="n-idle">0</b> idle</span><span class="ver" id="versions"></span></div><button type="button" class="queue-btn" id="queue-toggle" aria-expanded="false" aria-controls="queue">+ Queue run</button></header>
<div id="banner" hidden role="alert">Wall unreachable</div>
<section id="queue" hidden><h2>Queue a run</h2><form id="spec-form"><div class="fields"><label class="run-id">run id <input name="run_id" required readonly autocomplete="off"></label><label>mode <select name="planner"><option value="llm" selected>Play the game</option><option value="scripted">Walk to a place</option></select></label><label>starter <select name="starter"><option value="" class="llm-starter-opt" selected>Let LLM decide</option><option value="squirtle">Squirtle</option><option value="charmander">Charmander</option><option value="bulbasaur">Bulbasaur</option></select></label><label class="scripted-only" hidden>walk to <input name="dest" value="viridian pokemon center" autocomplete="off"></label><label class="llm-only goal-field">goal <input name="goal" value="Earn the Boulder Badge." autocomplete="off"></label><label class="llm-only">model <select name="llm_profile"><option value="auto" selected>Auto (GPU → LAN)</option><option value="default">Default (LAN)</option><option value="gpu">GPU only</option></select></label><label>seed <input name="seed" type="number" value="0"></label><label>fps <input name="fps" type="number" value="60"></label><label class="llm-only">round safety cap (0 = none) <input name="max_rounds" type="number" min="0" value="0" title="Optional emergency/experiment cap. Zero lets the goal and automatic stagnation watchdog decide when the run ends."></label><label class="check">keep going <input name="endless" type="checkbox"></label><label class="endless-only" hidden>next seed <select name="seed_mode"><option value="same">same seed</option><option value="random" selected>random seed</option></select></label><input type="hidden" name="max_frames" value="0"></div><div class="form-row"><button type="submit" class="submit">Queue run</button><span id="form-error" role="status"></span></div></form></section>
<main><div class="workspace"><section class="run-rail" aria-labelledby="live-title"><div class="rail-head"><h2 id="live-title" class="section-h">Runs</h2><div class="rail-note">Select a run to inspect</div></div><div id="live"></div></section><aside id="watch" hidden><div class="detail-head"><div class="detail-title-wrap"><h2 class="section-h" id="detail-title"></h2><div class="detail-sub">live run inspector</div></div><button type="button" class="close-detail" id="detail-close">Close</button></div><div class="watch-grid"><div class="watch-screens"><section class="screen-pane" aria-label="Game screen"><div class="screen-label"><strong>Game Boy view</strong><span>live frame</span></div><div class="lcd" id="detail-lcd"></div><div id="screen-event"></div></section><section class="map-panel" id="detail-map-panel" hidden aria-label="Live map"><div class="map-head"><strong>Semantic map</strong><span id="detail-map-status"></span></div><div class="map-scroll"><canvas id="detail-map" role="img" aria-label="Current map with player, sprites and movement trail"></canvas></div><div class="map-legend"><span><b>@</b> player</span><span><b>■</b> sprite</span><span><b>·</b> trail</span><span><b>W</b> warp</span><span><b>#</b> blocked</span></div></section></div><div class="watch-side"><div class="chips" id="detail-chips"></div><div id="detail-body"></div><div id="detail-party"></div></div></div></aside></div><div class="ops"><details class="ops-card" open><summary>Fleet health</summary><div class="ops-inner"><div id="workers"></div></div></details><details class="ops-card"><summary>Failure groups</summary><div class="ops-inner"><div id="failures"></div></div></details><details class="ops-card history" open><summary>Run history</summary><div class="ops-inner"><div class="section-top"><div class="filters" id="hist-filters"></div></div><div class="history-list"><div id="history"></div></div><div class="pager" id="hist-pager"></div><section id="run-inspector" class="inspect" aria-label="Run inspector"></section></div></details></div></main>
<script>(()=>{const nativeFetch=window.fetch.bind(window);window.fetch=(input,init)=>{const url=typeof input==="string"?input:(input&&input.url)||"";if(url.startsWith("/maps/"))return nativeFetch(input,{...(init||{}),cache: "no-store"});return nativeFetch(input,init)}})();</script>
<script src="/ui.js"></script>
<script>(()=>{const moveLastEvent=()=>{const target=document.getElementById("screen-event"),body=document.getElementById("detail-body");if(!target||!body)return;const blocks=[...body.querySelectorAll(":scope > .block")];const last=blocks.find((b)=>((b.querySelector("h3")||{}).textContent||"").trim().toLowerCase()==="last event");if(last){last.classList.add("screen-event-card");target.replaceChildren(last)}};const body=document.getElementById("detail-body");if(body)new MutationObserver(moveLastEvent).observe(body,{childList:true});moveLastEvent()})();</script>
</body>
</html>
