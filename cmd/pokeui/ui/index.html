<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pokefarm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14180f;
    --panel: #1e2619;
    --panel-2: #252e1f;
    --bezel: #8b8355;
    --bezel-dark: #5c5638;
    --lcd-dark: #0f380f;
    --lcd: #9bbc0f;
    --red: #c62828;
    --cream: #d4c89a;
    --line: #3a4530;
    --focus: #9bbc0f;
    --amber: #c4a035;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--cream); }
  body {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 13px;
    line-height: 1.45;
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: var(--space-4) var(--space-5);
    padding: 20px var(--space-5) var(--space-4);
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  h1 {
    font-family: Syne, sans-serif;
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin: 0;
    color: var(--lcd);
  }
  .counts { display: flex; gap: 20px; color: var(--bezel); }
  .counts b { color: var(--cream); font-weight: 500; }
  .queue-btn {
    margin-left: auto;
    background: var(--lcd);
    color: var(--lcd-dark);
    border: 0;
    padding: var(--space-2) 14px;
    font-family: Syne, sans-serif;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .queue-btn:hover { filter: brightness(1.08); }
  .queue-btn[aria-expanded="true"] { background: var(--bezel); color: var(--ink); }
  #banner {
    background: var(--red);
    color: #fff8e8;
    padding: 10px var(--space-5);
  }
  #banner[hidden] { display: none; }
  #queue {
    background: var(--panel-2);
    padding: var(--space-4) var(--space-5) 20px;
    border-bottom: 1px solid var(--line);
  }
  #queue[hidden] { display: none; }
  #queue h2, .section-h {
    font-family: Syne, sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 var(--space-3);
    color: var(--lcd);
  }
  .fields {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: var(--space-3);
    max-width: 960px;
  }
  label { display: flex; flex-direction: column; gap: var(--space-1); color: var(--bezel); }
  label[hidden], .scripted-only[hidden] { display: none !important; }
  input, select {
    background: var(--ink);
    border: 1px solid var(--line);
    padding: var(--space-2) 10px;
    color: var(--cream);
  }
  .form-row { display: flex; align-items: center; gap: var(--space-4); margin-top: var(--space-4); }
  .submit {
    background: var(--lcd);
    color: var(--lcd-dark);
    border: 0;
    padding: var(--space-2) var(--space-4);
    font-family: Syne, sans-serif;
    font-weight: 700;
  }
  .submit:disabled, .queue-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #form-error { color: #ffb4a8; }
  main { padding: 20px var(--space-5) 48px; display: grid; gap: var(--space-5); }
  .check {
    flex-direction: row;
    align-items: center;
    gap: var(--space-2);
  }
  .check input { width: auto; }
  .llm-only[hidden], .endless-only[hidden] { display: none !important; }
  #live {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
    gap: var(--space-4);
  }
  .bezel {
    background: var(--bezel);
    padding: var(--space-3) var(--space-3) 14px;
    border: 0;
    text-align: left;
    width: 100%;
    box-shadow: 3px 6px 0 var(--ink);
    color: var(--ink);
    cursor: pointer;
  }
  .bezel.selected { box-shadow: 3px 6px 0 var(--lcd); }
  .lcd {
    background: var(--lcd-dark);
    height: 144px;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .lcd img {
    width: 160px;
    height: 144px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }
  .lcd .idle { color: #306230; font-size: 11px; }
  .meta { display: grid; gap: var(--space-2); margin-top: 10px; }
  .rid {
    font-family: Syne, sans-serif;
    font-weight: 700;
    font-size: 14px;
    line-height: 1.2;
    overflow-wrap: anywhere;
  }
  .chips { display: flex; flex-wrap: wrap; gap: var(--space-1); }
  .chip {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.04em;
    padding: 2px 6px;
    background: var(--ink);
    color: var(--lcd);
  }
  .chip.running { background: var(--lcd-dark); color: var(--lcd); }
  .chip.leased, .chip.queued { background: var(--bezel-dark); color: var(--cream); }
  .chip.done, .chip.outcome-done { background: var(--ink); color: var(--lcd); }
  .chip.idle { background: var(--ink); color: var(--bezel); }
  .chip.busy { background: var(--lcd-dark); color: var(--lcd); }
  .chip.outcome-stuck, .chip.outcome-budget { background: var(--bezel-dark); color: var(--amber); }
  .chip.outcome-error, .chip.outcome-lost, .chip.outcome-cancelled { background: var(--red); color: #fff8e8; }
  .chip.starter, .chip.how, .chip.seed, .chip.goal, .chip.loop {
    background: var(--ink);
    color: var(--cream);
  }
  .bezel .chip.starter, .bezel .chip.how, .bezel .chip.seed,
  .bezel .chip.goal, .bezel .chip.loop {
    background: #2a2716;
    color: #f0e6b8;
  }
  .facts {
    display: grid;
    gap: 2px;
    font-size: 12px;
  }
  .fact-k {
    color: var(--bezel-dark);
    font-size: 10px;
    letter-spacing: 0.04em;
  }
  .bezel .fact-k { color: #2a2716; }
  .cancel {
    margin-top: var(--space-1);
    background: var(--red);
    color: #fff8e8;
    border: 0;
    padding: 6px var(--space-2);
    font-size: 11px;
    width: 100%;
  }
  .cancel:hover { filter: brightness(1.1); }
  .empty { color: var(--bezel); padding: var(--space-2) 0; }
  #watch {
    background: var(--panel);
    padding: var(--space-4);
    border: 1px solid var(--line);
    display: grid;
    gap: var(--space-4);
  }
  #watch[hidden] { display: none; }
  @media (min-width: 900px) {
    #watch { grid-template-columns: minmax(320px, 480px) 1fr; align-items: start; }
    #watch .watch-side { grid-column: 2; grid-row: 1 / 4; }
    #watch .lcd { grid-row: 2; }
  }
  #watch .lcd {
    width: min(100%, 480px);
    height: auto;
    aspect-ratio: 160 / 144;
  }
  #watch .lcd img {
    width: 100%;
    height: 100%;
  }
  .detail-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-3);
  }
  .detail-head h2 { margin: 0; overflow-wrap: anywhere; }
  .close-detail {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--bezel);
    padding: 4px 8px;
    flex: none;
  }
  .close-detail:hover { color: var(--cream); border-color: var(--bezel); }
  .block {
    margin-top: var(--space-4);
  }
  .block h3 {
    margin: 0 0 var(--space-2);
    font-family: Syne, sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--bezel);
  }
  .kv {
    display: grid;
    grid-template-columns: 7.5rem 1fr;
    gap: 6px var(--space-3);
    margin: 0;
  }
  .kv dt { color: var(--bezel); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .trace {
    white-space: pre-wrap;
    color: var(--lcd);
    margin: var(--space-2) 0 0;
    max-height: 240px;
    overflow: auto;
  }
  .plan-k {
    color: var(--bezel);
    font-size: 10px;
    letter-spacing: 0.04em;
    margin-top: var(--space-2);
  }
  .plan-q {
    white-space: pre-wrap;
    color: var(--cream);
    margin: 4px 0 0;
    max-height: 280px;
    overflow: auto;
  }
  .plan-d {
    color: var(--lcd);
    margin: 4px 0 0;
    font-weight: 500;
  }
  .plan-wait {
    color: var(--bezel);
    margin: 4px 0 0;
  }
  #workers {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
  }
  .worker {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 8px var(--space-3);
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 12px;
    flex: 1 1 16rem;
    min-width: 0;
  }
  .worker .addr { color: var(--cream); overflow-wrap: anywhere; }
  .worker .ago { color: var(--bezel); font-size: 11px; }
  .worker .job { overflow-wrap: anywhere; }
  .section-top {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-3);
    margin-bottom: var(--space-3);
  }
  .section-top .section-h { margin: 0; }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2) var(--space-4);
  }
  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-1);
    align-items: center;
  }
  .filter-group span { color: var(--bezel); font-size: 11px; margin-right: 2px; }
  .filter {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--cream);
    padding: 3px 8px;
    font-size: 11px;
  }
  .filter:hover { border-color: var(--bezel); }
  .filter[aria-pressed="true"] {
    background: var(--lcd-dark);
    border-color: var(--lcd);
    color: var(--lcd);
  }
  #history { display: grid; }
  .hist-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: stretch;
    border-bottom: 1px solid var(--line);
  }
  .hist-row:hover { background: var(--panel); }
  .hist-row.selected { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--lcd); }
  .hist {
    display: grid;
    grid-template-columns: 6.5rem minmax(7rem, 1fr) minmax(8rem, 1.2fr) minmax(8rem, 1fr) auto;
    align-items: center;
    gap: 6px 14px;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 0;
    padding: 8px 4px;
    color: var(--cream);
  }
  .hist-del {
    background: transparent;
    border: 0;
    color: var(--bezel);
    padding: 8px 10px;
    font-size: 11px;
    align-self: center;
  }
  .hist-del:hover { background: var(--red); color: #fff8e8; }
  .hist-when { color: var(--bezel); font-size: 11px; }
  .hist-id { font-family: Syne, sans-serif; font-weight: 700; overflow-wrap: anywhere; }
  .hist-where { color: var(--cream); }
  .hist-out { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; text-align: right; }
  .hist-outcome { color: var(--bezel); font-size: 11px; max-width: 28ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-err { color: var(--red); margin-top: 6px; }
  @media (max-width: 800px) {
    .hist {
      grid-template-columns: 1fr auto;
    }
    .hist-when, .hist-where { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <header class="bar">
    <h1>pokefarm</h1>
    <div class="counts" aria-live="polite">
      <span><b id="n-running">0</b> running</span>
      <span><b id="n-queued">0</b> queued</span>
      <span><b id="n-idle">0</b> idle workers</span>
    </div>
    <button type="button" class="queue-btn" id="queue-toggle" aria-expanded="false" aria-controls="queue">Queue a run</button>
  </header>
  <div id="banner" hidden role="alert">wall unreachable</div>
  <section id="queue" hidden>
    <h2>Queue a run</h2>
    <form id="spec-form">
      <div class="fields">
        <label>run id <input name="run_id" required autocomplete="off"></label>
        <label>how
          <select name="planner">
            <option value="llm" selected>Play the game</option>
            <option value="scripted">Walk to a place</option>
          </select>
        </label>
        <label>starter
          <select name="starter">
            <option value="squirtle">Squirtle</option>
            <option value="charmander">Charmander</option>
            <option value="bulbasaur">Bulbasaur (loses the rival fight)</option>
          </select>
        </label>
        <label class="scripted-only" hidden>walk to
          <input name="dest" value="viridian pokemon center" autocomplete="off">
        </label>
        <label class="llm-only">goal
          <input name="goal" value="Earn the Boulder Badge." autocomplete="off">
        </label>
        <label>seed <input name="seed" type="number" value="0"></label>
        <label>fps <input name="fps" type="number" value="60"></label>
        <label>max rounds <input name="max_rounds" type="number" value="32"></label>
        <label>max frames <input name="max_frames" type="number" value="0"></label>
        <label class="check">keep going
          <input name="endless" type="checkbox">
        </label>
        <label class="endless-only" hidden>next seed
          <select name="seed_mode">
            <option value="same">same seed</option>
            <option value="random" selected>random seed</option>
          </select>
        </label>
      </div>
      <div class="form-row">
        <button type="submit" class="submit">Queue a run</button>
        <span id="form-error" role="status"></span>
      </div>
    </form>
  </section>
  <main>
    <aside id="watch" hidden>
      <div class="detail-head">
        <h2 class="section-h" id="detail-title"></h2>
        <button type="button" class="close-detail" id="detail-close">Close</button>
      </div>
      <div class="lcd" id="detail-lcd"></div>
      <div class="watch-side">
        <div class="chips" id="detail-chips"></div>
        <div id="detail-body"></div>
      </div>
    </aside>
    <section>
      <h2 class="section-h">Live</h2>
      <div id="live"></div>
    </section>
    <section>
      <h2 class="section-h">Workers</h2>
      <div id="workers"></div>
    </section>
    <section>
      <div class="section-top">
        <h2 class="section-h">History</h2>
        <div class="filters" id="hist-filters"></div>
      </div>
      <div id="history"></div>
    </section>
  </main>
<script src="/ui.js"></script>
</body>
</html>
