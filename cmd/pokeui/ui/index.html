<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PokéFarm Console</title>
<style>
:root{
  --bg:#e7ebf2;--bg-deep:#26334d;--surface:#f8f6ee;--surface-2:#f0ede3;--surface-3:#e9eef7;
  --ink:#25314a;--muted:#6b7487;--line:#cfd5df;--red:#d44a4a;--red-dark:#9d3434;--yellow:#efc84a;
  --blue:#4267a8;--blue-dark:#2d4779;--green:#3b8c63;--amber:#bd812d;--screen:#d8dfc7;--shadow:0 8px 24px rgba(31,42,66,.12);
  --r:12px
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button,input,select{touch-action:manipulation}:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:30;min-height:62px;display:flex;align-items:center;gap:18px;padding:9px 16px;color:#fff;background:#27344d;border-bottom:4px solid var(--red);box-shadow:0 5px 16px rgba(25,34,52,.2)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.ball{width:32px;height:32px;border-radius:50%;flex:none;background:linear-gradient(var(--red) 0 46%,#20283a 46% 56%,#f5f1e6 56%);border:3px solid #1b2437;position:relative}.ball:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;border:3px solid #1b2437;left:50%;top:50%;transform:translate(-50%,-50%)}
h1{margin:0;font-size:19px;line-height:1}.tagline{color:#c4ccdc;font-size:10px;margin-top:3px}.counts{display:flex;align-items:center;gap:13px;color:#cbd2df;font-size:11px;flex-wrap:wrap}.counts span:not(.ver){display:inline-flex;gap:5px}.counts b{color:#fff}#versions{color:#9ea9bd;font:10px ui-monospace,SFMono-Regular,Menlo,monospace}
.queue-btn,.submit{border:0;border-radius:999px;font-weight:800;background:var(--yellow);color:#26324a;padding:9px 15px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.1)}.queue-btn{margin-left:auto}.queue-btn[aria-expanded="true"]{background:#fff}.queue-btn:disabled,.submit:disabled{opacity:.45;cursor:not-allowed}
#banner{padding:9px 16px;color:#fff;background:var(--red-dark);font-weight:700}#queue{background:#f1f3f7;border-bottom:1px solid #c9d0dc;padding:15px 16px 17px}#queue h2{margin:0 0 11px;font-size:14px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px 11px;max-width:1280px}label{display:flex;flex-direction:column;gap:4px;color:#5f697c;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}label[hidden],.scripted-only[hidden],.llm-only[hidden],.endless-only[hidden]{display:none!important}input,select{width:100%;background:#fff;border:1px solid #c8d0dc;border-radius:8px;padding:8px 9px;text-transform:none;letter-spacing:normal}.check{flex-direction:row;align-items:center;gap:8px;align-self:end;min-height:36px}.check input{width:auto}.form-row{display:flex;gap:12px;align-items:center;margin-top:11px}#form-error{color:var(--red-dark);font-weight:700}
main{padding:14px;max-width:1760px;margin:0 auto}.workspace{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}.run-rail,#watch,.ops-card{background:var(--surface);border:1px solid #d3d7de;border-radius:var(--r);box-shadow:var(--shadow)}.run-rail{position:sticky;top:80px;max-height:calc(100vh - 94px);overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr)}.rail-head{padding:11px 12px;border-bottom:1px solid var(--line)}.rail-head h2,.section-h{margin:0;font-size:12px;color:var(--blue-dark)}.rail-note{color:var(--muted);font-size:9px;margin-top:2px}#live{padding:7px;overflow:auto;display:grid;gap:6px;align-content:start}.empty{color:var(--muted);padding:10px;margin:0}
.bezel{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;width:100%;min-width:0;padding:7px;border:1px solid #d7dbe2;border-radius:9px;background:#fff;color:var(--ink);text-align:left;box-shadow:none;transition:border-color .12s ease,background .12s ease}.bezel:hover{border-color:#aebbd0}.bezel.selected{background:#eef2f8;border-color:#879bbb;box-shadow:inset 3px 0 0 var(--red)}.bezel .lcd{width:76px;height:68px;border-radius:6px;background:#161b24}.bezel .lcd img{width:76px;height:68px;object-fit:contain}.bezel .meta{margin:0;gap:3px;min-width:0}.bezel .rid{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bezel .setting-chips .chip.goal,.bezel .setting-chips .chip.seed{display:none}.bezel .facts{font-size:9px;gap:1px;color:#687286}.bezel .fact-k{display:none}.bezel .facts>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bezel .cancel{padding:3px 6px;margin-top:2px;font-size:8px;border-radius:5px;width:auto;justify-self:start}.bezel .card-err{font-size:8px}
.lcd{background:#171c24;display:grid;place-items:center}.lcd img{image-rendering:pixelated;image-rendering:crisp-edges;display:block}.lcd .idle{color:#9ca6b8;font-size:10px}.meta{display:grid}.chips{display:flex;flex-wrap:wrap;gap:3px}.chip{display:inline-flex;align-items:center;min-height:17px;padding:2px 6px;border-radius:999px;background:#e7eaf0;color:#4e5a70;font-size:8px;font-weight:800}.chip.running,.chip.busy{background:#dfeee5;color:#2e7150}.chip.queued,.chip.leased,.chip.outcome-stuck,.chip.outcome-budget{background:#f7edcf;color:#8a641f}.chip.outcome-error,.chip.outcome-lost,.chip.outcome-cancelled{background:#f7dddd;color:#9b3838}.chip.done,.chip.outcome-done{background:#e1e8f3;color:#47628d}.cancel{border:0;border-radius:7px;background:#f4dedd;color:#9f3434;font-weight:750}.card-err{color:var(--red-dark)}
#watch{min-width:0;overflow:hidden}.detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;background:#eceff5;border-bottom:1px solid #cfd5df}.detail-title-wrap{min-width:0}#detail-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.detail-sub{color:var(--muted);font-size:9px;margin-top:2px}.close-detail{background:#fff;border:1px solid #c2cad6;color:#566176;border-radius:7px;padding:5px 8px}
.watch-grid{display:grid;grid-template-columns:minmax(270px,350px) minmax(220px,290px) minmax(340px,1fr);align-items:start;min-width:0}.screen-pane,.map-panel,.watch-side{min-width:0}.screen-pane{padding:12px;border-right:1px solid var(--line);background:#f5f3eb}.screen-label,.map-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;color:var(--muted);font-size:9px}.screen-label{margin-bottom:7px}.screen-label strong,.map-head strong{color:var(--blue-dark);font-size:11px}
#watch .lcd{width:100%;aspect-ratio:160/144;border-radius:10px;background:#11151c;overflow:visible;border:8px solid #555d6c;box-shadow:inset 0 0 0 2px #1c2230}#watch .lcd img{width:100%;height:100%;object-fit:contain;border-radius:2px}
#screen-event{margin-top:9px}.screen-event-card{background:#fff;border:1px solid #d7dce4;border-left:3px solid var(--yellow);border-radius:8px;padding:8px 9px}.screen-event-card h3{margin:0 0 4px;color:#5d6574;font-size:9px;text-transform:uppercase;letter-spacing:.05em}.screen-event-card .trace{max-height:64px;margin:0}
.map-panel{border-right:1px solid var(--line);background:#f0f2f5}.map-head{padding:9px 10px;border-bottom:1px solid var(--line)}.map-head span{color:var(--muted);font-size:9px;text-align:right}.map-scroll{height:230px;overflow:auto;padding:10px;display:grid;place-items:center;background:#e9edf2}.map-scroll:before{content:"";position:absolute}.map-panel{position:relative}#detail-map{display:block;image-rendering:pixelated;image-rendering:crisp-edges;max-width:min(100%,240px);max-height:210px;width:auto;height:auto}.map-legend{display:flex;flex-wrap:wrap;gap:5px 10px;padding:7px 10px;border-top:1px solid var(--line);color:var(--muted);font-size:8px;background:#f8f8f6}.map-legend b{color:var(--ink)}
.watch-side{padding:10px 11px 12px;max-height:calc(100vh - 126px);overflow:auto;background:var(--surface)}#detail-chips{position:sticky;top:0;z-index:2;background:var(--surface);padding-bottom:7px}#detail-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;align-items:start}.block{margin:0;padding:9px;background:#fff;border:1px solid #d9dde4;border-radius:9px;min-width:0}.block h3{margin:0 0 6px;color:var(--blue-dark);font-size:10px;text-transform:uppercase;letter-spacing:.05em}.kv{display:grid;grid-template-columns:5.8rem minmax(0,1fr);gap:3px 7px;margin:0;font-size:9px}.kv dt,.plan-k,.prow span:first-child{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}.trace{margin:4px 0 0;color:#34604b;white-space:pre-wrap;max-height:100px;overflow:auto;font:9px ui-monospace,SFMono-Regular,Menlo,monospace}.plan-k{margin-top:4px;font-size:8px;text-transform:uppercase;letter-spacing:.04em}.plan-q{margin:3px 0 0;max-height:132px;overflow:auto;white-space:pre-wrap;color:#313a4c;font:9px ui-monospace,SFMono-Regular,Menlo,monospace}.plan-d,.plan-wait{margin:3px 0 0;font-size:9px}.plan-d{color:#2e684b;font-weight:700}.plan-wait{color:var(--muted)}.plan-raw{margin-top:6px}.plan-raw summary{cursor:pointer;color:#5c6f8f;font-size:8px}.plan-raw pre{max-height:150px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:8px;background:#f3f4f6;padding:6px;border-radius:5px}.pnums{display:grid;grid-template-columns:1fr 1fr;gap:3px 7px;font-size:9px}.prow{display:flex;justify-content:space-between;gap:6px}.prow .pwarn{color:var(--amber);font-weight:800}.pintent{margin:5px 0 0;color:#496283;font-size:9px}.pchoices{margin-top:5px;display:grid;gap:2px}.pchoice{position:relative;display:flex;justify-content:space-between;gap:6px;padding:3px 5px;font-size:8px;overflow:hidden;border-radius:4px}.pbar{position:absolute;inset:0 auto 0 0;background:#e3e9f2;z-index:0}.pchoice span{position:relative;z-index:1}.pchoice .n{color:var(--blue);font-weight:800}.issue-a{color:var(--blue);font-weight:700;text-decoration:none}
.ops{margin-top:13px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}.ops-card{overflow:hidden;box-shadow:0 5px 15px rgba(35,45,66,.09)}.ops-card.history{grid-column:1/-1}.ops-card summary{list-style:none;cursor:pointer;padding:9px 11px;font-weight:800;color:var(--blue-dark);background:#eef0f4;border-bottom:1px solid #d2d7df;display:flex;align-items:center;gap:7px}.ops-card summary::-webkit-details-marker{display:none}.ops-card summary:before{content:"▸";color:var(--red)}.ops-card[open] summary:before{transform:rotate(90deg)}.ops-inner{padding:8px 10px 10px;max-height:285px;overflow:auto}.history .ops-inner{max-height:400px}#workers{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:5px}.worker{min-width:0;padding:6px 7px;border:1px solid #dce0e6;border-radius:7px;background:#fff;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 6px;align-items:center;font-size:9px}.worker .addr,.worker .job{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.worker .ver,.worker .ago{color:var(--muted);font:8px ui-monospace,SFMono-Regular,Menlo,monospace}.worker .job{grid-column:2/-1}.ver-summary{color:var(--muted);font-size:9px;margin:0 0 5px}#failures{display:grid;gap:5px}.fail-card{padding:7px 8px;border:1px solid #e4d5d1;border-radius:7px;background:#fff9f6;display:grid;gap:3px}.fail-pat{font-size:9px;font-weight:800;color:#7b413a}.fail-ex{font-size:8px;color:#806e69}.fail-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.fail-act{border:1px solid #b8c3d5;background:#f2f4f8;color:#405d8b;border-radius:6px;padding:3px 6px;font-size:8px;font-weight:700}.section-top{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:7px}.filters{display:flex;flex-wrap:wrap;gap:4px 7px}.filter-group{display:flex;flex-wrap:wrap;align-items:center;gap:3px}.filter-group>span{color:var(--muted);font-size:8px}.filter{border:1px solid #cad0da;border-radius:999px;background:#fff;color:#5a6475;padding:3px 6px;font-size:8px}.filter[aria-pressed="true"]{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff}#history{display:grid}.hist-row{display:grid;grid-template-columns:minmax(0,1fr) auto;border-bottom:1px solid #e0e3e8}.hist-row.selected{background:#edf1f6}.hist{width:100%;min-width:0;display:grid;grid-template-columns:5.2rem minmax(8rem,1.1fr) minmax(9rem,1.2fr) minmax(8rem,1fr) minmax(8rem,1fr);gap:7px;align-items:center;border:0;background:transparent;text-align:left;padding:6px 4px;font-size:8px}.hist-when,.hist-outcome{color:var(--muted)}.hist-id{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hist-where{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hist-out{display:flex;align-items:center;justify-content:flex-end;gap:4px;min-width:0}.hist-outcome{max-width:18ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hist-del{border:0;background:transparent;color:#a65353;padding:6px 7px;font-size:8px}.pager{display:flex;align-items:center;gap:6px;margin-top:7px;color:var(--muted);font-size:8px}.pager-btn{border:1px solid #cad0da;background:#fff;color:#536079;border-radius:6px;padding:3px 6px}.pager-btn:disabled{opacity:.4;cursor:default}
@media(max-width:1280px){.watch-grid{grid-template-columns:minmax(280px,1fr) minmax(220px,300px)}.watch-side{grid-column:1/-1;border-top:1px solid var(--line);max-height:none}#detail-body{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:960px){.workspace{grid-template-columns:1fr}.run-rail{position:static;max-height:none}#live{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));max-height:280px}.ops{grid-template-columns:1fr}.ops-card.history{grid-column:auto}}
@media(max-width:700px){.bar{gap:9px;padding:8px 9px}.tagline{display:none}.counts{order:3;flex-basis:100%;gap:7px}#versions{display:none}.queue-btn{padding:8px 10px}main{padding:9px}.workspace{gap:9px}#live{grid-template-columns:1fr;max-height:250px}.watch-grid{grid-template-columns:1fr}.screen-pane,.map-panel{border-right:0;border-bottom:1px solid var(--line)}.map-scroll{height:210px}#detail-body{grid-template-columns:1fr}.watch-side{padding:9px}.hist{grid-template-columns:minmax(0,1fr);gap:3px}.hist-out{justify-content:flex-start}.fields{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><span class="ball" aria-hidden="true"></span><div><h1>PokéFarm</h1><div class="tagline">distributed Pokémon runner console</div></div></div>
  <div class="counts" aria-live="polite"><span><b id="n-running">0</b> running</span><span><b id="n-queued">0</b> queued</span><span><b id="n-idle">0</b> idle</span><span class="ver" id="versions"></span></div>
  <button type="button" class="queue-btn" id="queue-toggle" aria-expanded="false" aria-controls="queue">+ Queue run</button>
</header>
<div id="banner" hidden role="alert">Wall unreachable</div>
<section id="queue" hidden>
  <h2>Queue a run</h2>
  <form id="spec-form"><div class="fields">
    <label>run id <input name="run_id" required autocomplete="off"></label>
    <label>mode <select name="planner"><option value="llm" selected>Play the game</option><option value="scripted">Walk to a place</option></select></label>
    <label>starter <select name="starter"><option value="squirtle">Squirtle</option><option value="charmander">Charmander</option><option value="bulbasaur">Bulbasaur</option></select></label>
    <label class="scripted-only" hidden>walk to <input name="dest" value="viridian pokemon center" autocomplete="off"></label>
    <label class="llm-only">goal <input name="goal" value="Earn the Boulder Badge." autocomplete="off"></label>
    <label>seed <input name="seed" type="number" value="0"></label><label>fps <input name="fps" type="number" value="60"></label><label>max rounds <input name="max_rounds" type="number" value="32"></label><label>max frames <input name="max_frames" type="number" value="0"></label>
    <label class="check">keep going <input name="endless" type="checkbox"></label><label class="endless-only" hidden>next seed <select name="seed_mode"><option value="same">same seed</option><option value="random" selected>random seed</option></select></label>
  </div><div class="form-row"><button type="submit" class="submit">Queue run</button><span id="form-error" role="status"></span></div></form>
</section>
<main>
  <div class="workspace">
    <section class="run-rail" aria-labelledby="live-title"><div class="rail-head"><h2 id="live-title" class="section-h">Runs</h2><div class="rail-note">Select a run to inspect</div></div><div id="live"></div></section>
    <aside id="watch" hidden>
      <div class="detail-head"><div class="detail-title-wrap"><h2 class="section-h" id="detail-title"></h2><div class="detail-sub">live run inspector</div></div><button type="button" class="close-detail" id="detail-close">Close</button></div>
      <div class="watch-grid">
        <section class="screen-pane" aria-label="Game screen"><div class="screen-label"><strong>Game Boy view</strong><span>live frame</span></div><div class="lcd" id="detail-lcd"></div><div id="screen-event"></div></section>
        <section class="map-panel" id="detail-map-panel" hidden aria-label="Live map"><div class="map-head"><strong>Semantic map</strong><span id="detail-map-status"></span></div><div class="map-scroll"><canvas id="detail-map" role="img" aria-label="Current map with player, sprites and movement trail"></canvas></div><div class="map-legend"><span><b>@</b> player</span><span><b>■</b> sprite</span><span><b>·</b> trail</span><span><b>W</b> warp</span><span><b>#</b> blocked</span></div></section>
        <div class="watch-side"><div class="chips" id="detail-chips"></div><div id="detail-body"></div></div>
      </div>
    </aside>
  </div>
  <div class="ops">
    <details class="ops-card" open><summary>Fleet health</summary><div class="ops-inner"><div id="workers"></div></div></details>
    <details class="ops-card"><summary>Failure groups</summary><div class="ops-inner"><div id="failures"></div></div></details>
    <details class="ops-card history"><summary>Run history</summary><div class="ops-inner"><div class="section-top"><div class="filters" id="hist-filters"></div></div><div id="history"></div><div class="pager" id="hist-pager"></div></div></details>
  </div>
</main>
<script>
(()=>{const nativeFetch=window.fetch.bind(window);window.fetch=(input,init)=>{const url=typeof input==="string"?input:(input&&input.url)||"";if(url.startsWith("/maps/"))return nativeFetch(input,{...(init||{}),cache:"no-store"});return nativeFetch(input,init)}})();
</script>
<script src="/ui.js"></script>
<script>
(()=>{
  const moveLastEvent=()=>{
    const target=document.getElementById("screen-event");
    const body=document.getElementById("detail-body");
    if(!target||!body)return;
    const blocks=[...body.querySelectorAll(":scope > .block")];
    const last=blocks.find((b)=>((b.querySelector("h3")||{}).textContent||"").trim().toLowerCase()==="last event");
    if(last){last.classList.add("screen-event-card");target.replaceChildren(last)}
    else if(!document.getElementById("watch").hidden){target.replaceChildren()}
  };
  const body=document.getElementById("detail-body");
  if(body)new MutationObserver(moveLastEvent).observe(body,{childList:true});
  moveLastEvent();
})();
</script>
</body>
</html>
