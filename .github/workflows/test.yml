name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ROM-free verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PokePilot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Sync generated changes
        run: |
          go mod download
          gofmt -w cmd/pokeui/mcp.go
          if ! git diff --quiet -- go.mod go.sum cmd/pokeui/mcp.go; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add go.mod go.sum cmd/pokeui/mcp.go
            git commit -m "ci: sync module graph and formatting"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        env:
          POKEMON_RED_ROM: ""
        run: go vet ./...

      # ROM-backed fixture tests already skip when POKEMON_RED_ROM is unset.
      # -short also skips intentionally long journey tests, so CI never needs
      # a commercial Pokemon ROM or a full Pokemon gameplay run.
      - name: Run short test suite
        env:
          POKEMON_RED_ROM: ""
        run: go test -short -count=1 ./...

      - name: Run short race suite
        env:
          POKEMON_RED_ROM: ""
        run: go test -race -short -count=1 ./...
