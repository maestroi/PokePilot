name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ROM-free verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PokePilot
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve GomeBoy module checksum
        run: |
          go mod download github.com/maestroi/gomeboy@v1.1.0
          git diff -- go.sum
          exit 1

      - name: Verify module graph
        run: |
          go mod download
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        env:
          POKEMON_RED_ROM: ""
        run: go vet ./...

      # ROM-backed fixture tests already skip when POKEMON_RED_ROM is unset.
      # -short also skips intentionally long journey tests, so CI never needs
      # a commercial Pokemon ROM or a full Pokemon gameplay run.
      - name: Run short test suite
        env:
          POKEMON_RED_ROM: ""
        run: go test -short -count=1 ./...

      - name: Run short race suite
        env:
          POKEMON_RED_ROM: ""
        run: go test -race -short -count=1 ./...
