name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ROM-free verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PokePilot
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go mod download
          if ! git diff --quiet -- go.mod go.sum; then
            {
              echo 'CI-generated module graph diff:'
              echo
              echo '```diff'
              git diff -- go.mod go.sum
              echo '```'
            } > /tmp/module-diff.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/module-diff.md
            exit 1
          fi

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        env:
          POKEMON_RED_ROM: ""
        run: go vet ./...

      # ROM-backed fixture tests already skip when POKEMON_RED_ROM is unset.
      # -short also skips intentionally long journey tests, so CI never needs
      # a commercial Pokemon ROM or a full Pokemon gameplay run.
      - name: Run short test suite
        env:
          POKEMON_RED_ROM: ""
        run: go test -short -count=1 ./...

      - name: Run short race suite
        env:
          POKEMON_RED_ROM: ""
        run: go test -race -short -count=1 ./...
