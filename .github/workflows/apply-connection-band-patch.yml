name: Apply connection-band patch

on:
  push:
    branches:
      - fix/connection-component-bands

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[connection-band-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/connection-component-bands

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply patch
        run: python3 .github/apply_connection_band_patch.py

      - name: Format
        run: gofmt -w world/graph.go world/connection_band.go world/connection_band_test.go skill/warp.go skill/route_transition.go skill/connection_edge.go

      - name: Focused ROM-free tests
        env:
          POKEMON_RED_ROM: ""
        run: go test -short -count=1 ./world ./skill

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/apply_connection_band_patch.py
          rm .github/workflows/apply-connection-band-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: scope map connections by landing component [connection-band-applied]"
          git push origin HEAD:fix/connection-component-bands
