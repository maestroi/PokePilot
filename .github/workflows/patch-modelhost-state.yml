name: Patch modelhost state

on:
  push:
    branches:
      - feat/723-724-model-experiments

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix process-exit state transition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cmd/pokemodelhost/main.go')
          text = p.read_text()
          old = 'if generation != s.generation || s.state == "ready" {\n\t\treturn\n\t}'
          new = 'if generation != s.generation {\n\t\treturn\n\t}'
          if old not in text:
              raise SystemExit('target state-transition block not found')
          p.write_text(text.replace(old, new, 1))
          PY
          gofmt -w cmd/pokemodelhost/main.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/pokemodelhost/main.go
          git commit -m "fix(modelhost): mark exited ready process failed"
          git push origin "HEAD:${GITHUB_REF_NAME}"
