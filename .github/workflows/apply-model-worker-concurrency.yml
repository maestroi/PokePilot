name: Verify model worker concurrency implementation

on:
  push:
    branches:
      - feature/model-worker-concurrency
    paths:
      - .github/workflows/apply-model-worker-concurrency.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/model-worker-concurrency
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply final correctness fixes
        run: python3 .github/finalize_model_worker_concurrency.py
      - name: Format Go
        run: gofmt -w farm/experiment.go cmd/pokewall/model_experiments.go cmd/pokewall/model_experiments_test.go
      - name: Go tests
        run: go test ./farm ./cmd/pokemodelhost ./cmd/pokewall
      - name: Web build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit final fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add farm cmd web
          git commit -m "fix(models): enforce deployment concurrency ceilings"
          git push origin HEAD:feature/model-worker-concurrency
