name: Apply model worker concurrency implementation

on:
  push:
    branches:
      - feature/model-worker-concurrency
    paths:
      - .github/workflows/apply-model-worker-concurrency.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/model-worker-concurrency
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Normalize patch target formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('farm/experiment.go')
          s = p.read_text()
          s = s.replace('\tReasoningEffort string        `json:"reasoning_effort,omitempty"`', '\tReasoningEffort string `json:"reasoning_effort,omitempty"`')
          s = s.replace('\tFPS             int           `json:"fps,omitempty"`', '\tFPS             int    `json:"fps,omitempty"`')
          s = s.replace('\tMaxRounds       int           `json:"max_rounds,omitempty"`', '\tMaxRounds       int    `json:"max_rounds,omitempty"`')
          s = s.replace('\tMaxFrames       int           `json:"max_frames,omitempty"`', '\tMaxFrames       int    `json:"max_frames,omitempty"`')
          p.write_text(s)
          PY
      - name: Apply implementation
        run: python3 .github/apply_model_worker_concurrency.py
      - name: Format Go
        run: gofmt -w farm/model_registry.go farm/model_registry_postgres.go farm/experiment.go farm/model_registry_concurrency_test.go cmd/pokemodelhost/main.go cmd/pokemodelhost/main_test.go cmd/pokewall/model_experiments.go cmd/pokewall/model_experiments_test.go
      - name: Go tests
        run: go test ./farm ./cmd/pokemodelhost ./cmd/pokewall
      - name: Web build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add farm cmd deploy web
          git commit -m "feat(models): cap parallel workers per deployment"
          git push origin HEAD:feature/model-worker-concurrency
