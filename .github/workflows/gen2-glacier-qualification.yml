name: Gen2 Glacier ROM Qualification

# Manual private Gold/Silver badge-6-to-7 journey. No commercial ROM,
# emulator checkpoint, or private save state may enter public artifacts.
on:
  workflow_dispatch:
    inputs:
      game:
        description: Retail cartridge to qualify
        required: true
        default: both
        type: choice
        options:
          - gold
          - silver
          - both

permissions:
  contents: read

concurrency:
  group: gen2-glacier-qualification
  cancel-in-progress: false

jobs:
  glacier:
    name: Gold/Silver Glacier checkpoint replay
    runs-on: [self-hosted, linux, pokepilot-rom]
    timeout-minutes: 240
    steps:
      - name: Checkout PokePilot
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve private corpus and results
        shell: bash
        env:
          CONFIGURED_CORPUS: ${{ vars.POKEPILOT_QUALIFICATION_CORPUS }}
          CONFIGURED_RESULTS: ${{ vars.POKEPILOT_QUALIFICATION_RESULTS }}
        run: |
          set -euo pipefail
          echo "POKEPILOT_GLACIER_CORPUS=${CONFIGURED_CORPUS:-/var/lib/pokepilot/qualification}" >> "$GITHUB_ENV"
          results="${CONFIGURED_RESULTS:-$HOME/.local/state/pokepilot/qualification}"
          out="$results/gen2-glacier/${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$out"
          echo "POKEPILOT_GLACIER_RESULTS=$out" >> "$GITHUB_ENV"

      - name: Replay six to seven badges
        shell: bash
        env:
          INPUT_GAME: ${{ inputs.game }}
          CONFIGURED_GOLD_ROM: ${{ vars.POKEMON_GOLD_ROM_PATH }}
          CONFIGURED_SILVER_ROM: ${{ vars.POKEMON_SILVER_ROM_PATH }}
        run: |
          set -euo pipefail
          games=("${INPUT_GAME:-both}")
          if [[ "${INPUT_GAME:-both}" == "both" ]]; then
            games=(gold silver)
          fi
          for game in "${games[@]}"; do
            case "$game" in
              gold) rom="${CONFIGURED_GOLD_ROM:-$HOME/.config/pokepilot/pokemon_gold.gbc}" ;;
              silver) rom="${CONFIGURED_SILVER_ROM:-$HOME/.config/pokepilot/pokemon_silver.gbc}" ;;
              *) echo "::error::unknown game $game"; exit 2 ;;
            esac
            checkpoint="$POKEPILOT_GLACIER_CORPUS/gs-glacier/$game/post-mineral/start.state"
            source="${checkpoint%/*}/source.json"
            if [[ ! -f "$rom" || ! -s "$checkpoint" || ! -s "$source" ]]; then
              echo "::error::Missing authentic $game ROM, post-Mineral state, or source.json"
              echo "### $game BLOCKED: no verified private six-badge fixture" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            out="$POKEPILOT_GLACIER_RESULTS/$game"
            mkdir -p "$out"
            export POKEPILOT_GS_GLACIER_QUAL=1
            export POKEPILOT_GS_GLACIER_GAME="$game"
            export POKEPILOT_GS_GLACIER_ROM="$rom"
            export POKEPILOT_GS_GLACIER_START="$checkpoint"
            export POKEPILOT_GS_GLACIER_OUT="$out"
            # Test validates source.json, retail ROM SHA-1 and state SHA-256
            # before running any emulated frame.
            go test -count=1 -timeout=90m ./agent \
              -run '^TestGSGlacierROMCheckpointReplay$' -v \
              2>&1 | tee "$out/run.log"
            echo "PASS $game: verified Rocket Hideout and Glacier Badge replay" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Extract safe diagnostics only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          safe="$RUNNER_TEMP/pokepilot-gen2-glacier-safe"
          rm -rf "$safe"
          mkdir -p "$safe"
          if [[ -d "${POKEPILOT_GLACIER_RESULTS:-}" ]]; then
            cd "$POKEPILOT_GLACIER_RESULTS"
            while IFS= read -r -d '' file; do
              mkdir -p "$safe/$(dirname "$file")"
              cp "$file" "$safe/$file"
            done < <(find . -type f ! -name '*.state' ! -name '*.sav' \
              ! -name '*.gb' ! -name '*.gbc' -print0)
          fi
          echo "POKEPILOT_GLACIER_SAFE=$safe" >> "$GITHUB_ENV"
          echo "Private replay checkpoints stay on the self-hosted runner; public artifact contains no ROM or save state." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload safe replay diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen2-glacier-qualification-diagnostics
          path: ${{ env.POKEPILOT_GLACIER_SAFE }}
          retention-days: 14
          if-no-files-found: warn
