name: Issue 148 ROM qualification

on:
  push:
    branches:
      - issue-148-training-xp-efficiency

permissions:
  contents: read

jobs:
  training-rom:
    runs-on: [self-hosted, linux, pokepilot-rom]
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve private ROM
        shell: bash
        env:
          CONFIGURED_ROM: ${{ vars.POKEMON_RED_ROM_PATH }}
        run: |
          set -euo pipefail
          test -n "$CONFIGURED_ROM"
          test -r "$CONFIGURED_ROM"
          echo "POKEMON_RED_ROM=$CONFIGURED_ROM" >> "$GITHUB_ENV"

      - name: Verify real encounter-band training evidence
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./agent -run '^TestROMTrainingViabilityMovesBeyondObsoleteRoute1Band$'
