# Publish the farm image to GHCR. No deploy, no hosts, no tokens, no ROM —
# the Swarm manager pulls the new digest on its own.
name: Publish farm image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-farm
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/maestroi/pokepilot-farm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PokePilot
        uses: actions/checkout@v4
        with:
          path: pokepilot

      # go.mod replaces gomeboy with an absolute path; the Dockerfile copies
      # this named context to that path. Keep it outside the PokePilot context.
      - name: Checkout gomeboy
        uses: actions/checkout@v4
        with:
          repository: maestroi/gomeboy
          path: gomeboy

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./pokepilot
          file: ./pokepilot/deploy/Dockerfile
          build-contexts: gomeboy=./gomeboy
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
