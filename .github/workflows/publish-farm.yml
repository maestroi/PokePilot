# Build the farm image for every pull request and publish deployable images to GHCR.
# Same-repository PRs and main pushes move :latest, which the Swarm manager
# already watches and pins by digest. Fork PRs still prove the Docker build but
# never receive package-write credentials and therefore cannot deploy code.
name: Publish farm image

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# :latest is one shared end-to-end environment. A newer PR/main event cancels
# an older in-flight image build so stale work cannot win the deployment race.
concurrency:
  group: publish-farm
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/maestroi/pokepilot

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Normal PR events intentionally build GitHub's merge ref: the deployed
      # image is the code as it would land on main, not just the head branch.
      - name: Checkout PokePilot
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          path: pokepilot

      # If a PR is closed without another image immediately following it,
      # restore :latest to the current base branch instead of leaving the
      # integration Swarm pinned to code that is no longer under review.
      - name: Checkout base after PR close
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: pokepilot

      # go.mod replaces gomeboy with an absolute path; the Dockerfile copies
      # this named context to that path. Keep it outside the PokePilot context.
      - name: Checkout gomeboy
        uses: actions/checkout@v4
        with:
          repository: maestroi/gomeboy
          path: gomeboy

      - name: Record source revision
        id: source
        shell: bash
        run: echo "sha=$(git -C pokepilot rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # pull_request workflows from forks have a read-only GITHUB_TOKEN. They
      # still execute the exact Docker build below, but do not log in or push.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish deployable image
        uses: docker/build-push-action@v6
        with:
          context: ./pokepilot
          file: ./pokepilot/deploy/Dockerfile
          build-contexts: gomeboy=./gomeboy
          build-args: |
            GIT_SHA=${{ steps.source.outputs.sha }}
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.source.outputs.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
