# Publish the farm image to GHCR. No deploy, no hosts, no tokens, no ROM —
# the Swarm manager pulls the new digest on its own.
name: Publish farm image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-farm
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  packages: write

env:
  IMAGE: ghcr.io/maestroi/pokepilot

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PokePilot
        uses: actions/checkout@v4
        with:
          path: pokepilot

      # go.mod replaces gomeboy with an absolute path; the Dockerfile copies
      # this named context to that path. Keep it outside the PokePilot context.
      - name: Checkout gomeboy
        uses: actions/checkout@v4
        with:
          repository: maestroi/gomeboy
          path: gomeboy

      - name: Resolve build provenance
        id: buildmeta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prs_file="$(mktemp)"
          if ! gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" > "${prs_file}"; then
            printf '[]\n' > "${prs_file}"
          fi

          pr_number="$(jq -r 'map(select(.merged_at != null)) | last | .number // 0' "${prs_file}")"
          pr_title="$(jq -r 'map(select(.merged_at != null)) | last | .title // empty' "${prs_file}")"
          if [ -z "${pr_title}" ]; then
            pr_title="$(git -C pokepilot log -1 --pretty=%s)"
          fi
          pr_title_b64="$(printf '%s' "${pr_title}" | base64 -w0)"

          printf 'pr_number=%s\n' "${pr_number}" >> "${GITHUB_OUTPUT}"
          printf 'pr_title_b64=%s\n' "${pr_title_b64}" >> "${GITHUB_OUTPUT}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./pokepilot
          file: ./pokepilot/deploy/Dockerfile
          build-contexts: gomeboy=./gomeboy
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_PR_NUMBER=${{ steps.buildmeta.outputs.pr_number }}
            GIT_PR_TITLE_B64=${{ steps.buildmeta.outputs.pr_title_b64 }}
            GIT_REPOSITORY=${{ github.repository }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
