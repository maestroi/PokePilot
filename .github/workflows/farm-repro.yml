name: Farm Repro Replay

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Farm issue number containing a portable repro bundle
        required: true
        type: string
      replay_timeout_minutes:
        description: Maximum time to replay the checkpoint on this revision
        required: true
        default: "20"
        type: string
  push:
    branches:
      - "repro/**"

permissions:
  contents: read
  issues: read

concurrency:
  group: farm-repro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    runs-on: [self-hosted, linux, pokepilot-rom]
    timeout-minutes: 90

    steps:
      - name: Checkout PokePilot
        uses: actions/checkout@v4
        with:
          # Agent-triggered repro branches add one control-file commit on top
          # of the revision being tested. We need that parent available below.
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module graph
        run: go mod download

      - name: Resolve and verify ROM
        shell: bash
        env:
          CONFIGURED_ROM: ${{ vars.POKEMON_RED_ROM_PATH }}
          ROM_URL: ${{ secrets.POKEPILOT_ROM_URL || vars.POKEPILOT_ROM_URL }}
        run: |
          set -euo pipefail
          target="${CONFIGURED_ROM:-$HOME/.config/pokepilot/pokemon_red.gb}"
          export POKEPILOT_ROM_URL="$ROM_URL"
          rom="$(bash ./scripts/ensure-rom.sh "$target")"
          echo "POKEMON_RED_ROM=$rom" >> "$GITHUB_ENV"

      - name: Resolve farm repro bundle
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
          INPUT_TIMEOUT: ${{ inputs.replay_timeout_minutes }}
          CONFIGURED_RESULTS: ${{ vars.POKEPILOT_DEBUG_RESULTS }}
        run: |
          set -euo pipefail

          issue="${INPUT_ISSUE:-}"
          timeout_minutes="${INPUT_TIMEOUT:-20}"
          target_revision="$GITHUB_SHA"

          # Connected agents can trigger this workflow without workflow-dispatch
          # permission by pushing a trusted repro/* branch with this control file.
          # Parse only known KEY=value fields; never source/eval branch data.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ ! -f .github/farm-repro.env ]]; then
              echo "farm-repro: repro branch is missing .github/farm-repro.env" >&2
              exit 2
            fi
            while IFS='=' read -r key value; do
              [[ -z "$key" || "$key" == \#* ]] && continue
              case "$key" in
                ISSUE_NUMBER) issue="$value" ;;
                REPLAY_TIMEOUT_MINUTES) timeout_minutes="$value" ;;
                *) echo "farm-repro: unknown config key $key" >&2; exit 2 ;;
              esac
            done < .github/farm-repro.env
            target_revision="$(git rev-parse HEAD^1)"
          fi

          if [[ ! "$issue" =~ ^[1-9][0-9]*$ ]]; then
            echo "farm-repro: issue_number must be a positive integer" >&2
            exit 2
          fi
          if [[ ! "$timeout_minutes" =~ ^[1-9][0-9]*$ ]] || (( timeout_minutes > 60 )); then
            echo "farm-repro: replay_timeout_minutes must be between 1 and 60" >&2
            exit 2
          fi

          safe="$RUNNER_TEMP/pokepilot-farm-repro-safe"
          results="${CONFIGURED_RESULTS:-$HOME/.local/state/pokepilot/debug}"
          private="$results/farm-repro-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$safe"
          mkdir -p "$safe" "$private"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${issue}" \
            > "$safe/issue.json"
          jq -r '.body // ""' "$safe/issue.json" > "$safe/issue-body.txt"

          bundle_url="$(grep -Eo "https://github\\.com/maestroi/PokePilot/releases/download/farm-repros/repro-issue-${issue}-[A-Za-z0-9._-]+\\.zip" "$safe/issue-body.txt" | tail -n 1 || true)"
          if [[ -z "$bundle_url" ]]; then
            echo "farm-repro: issue #$issue has no trusted farm-repros bundle URL" >&2
            exit 2
          fi

          {
            echo "ISSUE_NUMBER=$issue"
            echo "REPLAY_TIMEOUT_MINUTES=$timeout_minutes"
            echo "BUNDLE_URL=$bundle_url"
            echo "TARGET_REVISION=$target_revision"
            echo "SAFE_OUT=$safe"
            echo "PRIVATE_OUT=$private"
          } >> "$GITHUB_ENV"

          {
            echo "issue=$issue"
            echo "revision=$target_revision"
            echo "trigger_revision=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            echo "bundle_url=$bundle_url"
            echo "timeout_minutes=$timeout_minutes"
          } > "$safe/request.txt"

      - name: Deterministically replay captured failure
        id: replay
        if: ${{ steps.request.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=30s "${REPLAY_TIMEOUT_MINUTES}m" \
            go run ./cmd/pokerepro \
              -bundle "$BUNDLE_URL" \
              -out "$PRIVATE_OUT/repro" \
              -verify \
              -result "$SAFE_OUT/repro-result.json" \
            2>&1 | tee "$SAFE_OUT/run.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > "$SAFE_OUT/exit-code.txt"
          exit "$status"

      - name: Finalize replay result
        id: classify
        if: ${{ always() && steps.request.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat "$SAFE_OUT/exit-code.txt" 2>/dev/null || echo 125)"

          if [[ ! -f "$SAFE_OUT/repro-result.json" ]]; then
            classification="harness_error"
            if [[ "$status" == "124" || "$status" == "137" ]]; then
              classification="timeout"
            fi
            jq -n \
              --argjson issue "$ISSUE_NUMBER" \
              --arg classification "$classification" \
              --argjson exit_code "$status" \
              '{issue:$issue,classification:$classification,exit_code:$exit_code}' \
              > "$SAFE_OUT/repro-result.json"
          fi

          tmp="$SAFE_OUT/repro-result.tmp.json"
          jq \
            --arg revision "$TARGET_REVISION" \
            --arg trigger_revision "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg bundle_url "$BUNDLE_URL" \
            --argjson exit_code "$status" \
            '. + {revision:$revision,trigger_revision:$trigger_revision,ref:$ref,bundle_url:$bundle_url,exit_code:$exit_code}' \
            "$SAFE_OUT/repro-result.json" > "$tmp"
          mv "$tmp" "$SAFE_OUT/repro-result.json"

          classification="$(jq -r '.classification' "$SAFE_OUT/repro-result.json")"
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          {
            echo '### Farm repro replay'
            echo
            echo "Issue: #$ISSUE_NUMBER"
            echo "Revision under test: \`$TARGET_REVISION\`"
            echo "Classification: **$classification**"
            echo "Process exit: \`$status\`"
            source_fp="$(jq -r '.source_fingerprint // empty' "$SAFE_OUT/repro-result.json")"
            observed_fp="$(jq -r '.observed_fingerprint // empty' "$SAFE_OUT/repro-result.json")"
            [[ -n "$source_fp" ]] && echo "Source fingerprint: \`$source_fp\`"
            [[ -n "$observed_fp" ]] && echo "Observed fingerprint: \`$observed_fp\`"
            echo
            echo 'Green means the captured structured objective succeeded on this revision. Any reproduced/different/timeout/missing-contract/harness result is red.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload replay diagnostics
        if: ${{ always() && steps.request.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: farm-repro-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pokepilot-farm-repro-safe
          if-no-files-found: error
          retention-days: 14

      - name: Enforce replay verdict
        if: ${{ always() && steps.request.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          classification="$(jq -r '.classification // "harness_error"' "$SAFE_OUT/repro-result.json")"
          if [[ "$classification" == "objective_succeeded" ]]; then
            echo "farm-repro: captured objective succeeds on $TARGET_REVISION"
            exit 0
          fi
          echo "farm-repro: replay verdict is $classification" >&2
          exit 1
