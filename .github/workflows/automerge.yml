# Squash-merge maestroi's non-draft same-repo PRs into main once ROM-free
# Tests pass. Everyone else's PRs stay manual.
#
# GitHub auto-merge enabled by GITHUB_TOKEN is attributed to github-actions[bot],
# which does not fire the push workflows that publish the farm image. After a
# successful Tests run we therefore merge if needed and always dispatch
# publish-farm for PRs that landed on main.
name: Automerge

on:
  pull_request:
    types:
      [opened, ready_for_review, reopened, synchronize, auto_merge_enabled, closed]
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: automerge-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  enable:
    name: Enable auto-merge
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'maestroi'
    runs-on: ubuntu-latest
    steps:
      - name: Queue squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! out="$(gh pr merge "$PR" --squash --delete-branch --auto 2>&1)"; then
            printf '%s\n' "$out"
            if grep -qiE 'already enabled|already merged' <<<"$out"; then
              exit 0
            fi
            exit 1
          fi
          printf '%s\n' "$out"

  publish_on_merge:
    name: Publish farm on merge
    # Backstop for the "merge" job below: that one depends on the Tests
    # workflow_run event cascading, which can silently miss (e.g. run
    # 4561b38/#302 landed on main without ever dispatching a rebuild).
    # This fires directly off the PR-closed event instead, so a rebuild
    # still happens even if the workflow_run trigger never delivers.
    # publish-farm.yml's own concurrency group (cancel-in-progress) makes a
    # duplicate dispatch from the other job harmless.
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch publish-farm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run publish-farm.yml --ref main

  close_triage_issues:
    name: Close repaired farm issues
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Close issues matching merged triage keys
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          mapfile -t keys < <(
            grep -oE '\[triage:[A-Za-z0-9._-]+\]' <<<"$PR_TITLE" \
              | sed -E 's/^\[triage:([^]]+)\]$/\1/' \
              | sort -u \
              || true
          )
          if (( ${#keys[@]} == 0 )); then
            echo "PR #${PR} has no triage key; nothing to close."
            exit 0
          fi

          for key in "${keys[@]}"; do
            marker="- **Triage key:** \`${key}\`"
            mapfile -t issues < <(
              gh api --paginate "/repos/${REPO}/issues?state=open&per_page=100" \
                | jq -r --arg marker "$marker" '
                    .[]
                    | select(.pull_request == null)
                    | select((.body // "") | contains($marker))
                    | .number
                  '
            )

            if (( ${#issues[@]} == 0 )); then
              echo "No open farm issue matches triage key ${key}."
              continue
            fi

            for issue in "${issues[@]}"; do
              gh issue comment "$issue" --body \
                "Repair merged in #${PR} at \`${MERGE_SHA}\` with \`[triage:${key}]\`. Closing this farm fingerprint automatically; a recurrence from a runner containing the repair is still eligible to reopen as a regression through the revision gate."
              gh issue close "$issue" --reason completed
              echo "Closed issue #${issue} for triage key ${key}."
            done
          done

  disable:
    name: Keep others manual
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.user.login != 'maestroi'
    runs-on: ubuntu-latest
    steps:
      - name: Disable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! out="$(gh pr merge "$PR" --disable-auto 2>&1)"; then
            printf '%s\n' "$out"
            if grep -qiE 'not enabled|disabled' <<<"$out"; then
              exit 0
            fi
            exit 1
          fi
          printf '%s\n' "$out"

  merge:
    name: Merge and publish farm
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge passing PR and dispatch farm publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          ALLOWED_AUTHOR: maestroi
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr_json="$(gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${REPO}/commits/${HEAD_SHA}/pulls")"
          pr_number="$(jq -r --arg repo "$REPO" --arg author "$ALLOWED_AUTHOR" '
            [.[]
              | select(.state=="open" or .merged_at != null)
              | select(.base.ref=="main")
              | select(.draft==false)
              | select(.head.repo.full_name==$repo)
              | select(.user.login==$author)
            ] | first | .number // empty
          ' <<<"$pr_json")"
          if [[ -z "${pr_number}" ]]; then
            echo "No ${ALLOWED_AUTHOR} PR into main for ${HEAD_SHA}; skipping auto-merge."
            exit 0
          fi

          state="$(gh pr view "$pr_number" --json state,isDraft,baseRefName,headRepository --jq \
            '{state,isDraft,baseRefName,head:.headRepository.nameWithOwner}')"
          echo "PR #${pr_number}: ${state}"

          if [[ "$(jq -r .state <<<"$state")" != "MERGED" ]]; then
            merged_now=0
            for attempt in 1 2 3 4 5 6; do
              if gh pr merge "$pr_number" --squash --delete-branch; then
                merged_now=1
                break
              fi
              echo "Merge attempt ${attempt} did not land; retrying..."
              sleep 10
            done
            if [[ "$merged_now" -ne 1 ]]; then
              echo "PR #${pr_number} stayed unmerged after retries."
              exit 1
            fi
          fi

          merged="$(gh pr view "$pr_number" --json state --jq .state)"
          if [[ "$merged" == "MERGED" ]]; then
            gh workflow run publish-farm.yml --ref main
            echo "Dispatched Publish farm image for main after #${pr_number}."
          fi
