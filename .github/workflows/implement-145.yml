name: Implement issue 145

on:
  push:
    branches: [codex/issue-145-recoverable-faults]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    env:
      POKEMON_RED_ROM: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-145-recoverable-faults
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply implementation
        run: |
          python3 prepare_145.py
          python3 implement_145.py
      - name: Format and verify
        run: |
          gofmt -w skill/shop.go agent/objective_result.go agent/failure_identity.go agent/recovery.go agent/plan.go agent/run.go farm/failure.go cmd/pokepilot/failure_telemetry.go cmd/pokewall/objective_failures.go agent/recovery_faults_test.go skill/shop_error_test.go cmd/pokepilot/failure_telemetry_test.go farm/failure_test.go
          git diff --check
          go mod download
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test -short -count=1 ./...
          go test -race -short -count=1 ./...
      - name: Commit verified implementation
        run: |
          rm -f implement_145.py prepare_145.py .github/workflows/implement-145.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'runtime: recover bounded objective faults without hiding telemetry (#145)'
          git push origin HEAD:codex/issue-145-recoverable-faults
