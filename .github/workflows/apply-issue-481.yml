name: Apply issue 481 fix

on:
  push:
    branches: [fix/issue-481-hide-unviable-training]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply fix and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          offer = Path('agent/offer.go')
          s = offer.read_text()
          old = '''\tif obs.HasGrass && len(obs.Party) > 0 {\n\t\tlead := obs.Party[0]\n'''
          new = '''\t// Do not offer a Train transaction the executor can already prove cannot\n\t// reach its target inside the same bounded session. Besides wasting a\n\t// planner round, the executor rejects this before the first battle, so it\n\t// cannot even serve as the last-resort respawn escape described below.\n\tif obs.HasGrass && len(obs.Party) > 0 && !trainingUnviableHere(obs) {\n\t\tlead := obs.Party[0]\n'''
          if s.count(old) != 1:
              raise SystemExit(f'offer block match count={s.count(old)}')
          offer.write_text(s.replace(old, new, 1))

          test = Path('agent/training_test.go')
          s = test.read_text()
          old = '''func TestTrainingOfferCarriesOutsideBudgetEvidence(t *testing.T) {\n\tobs := Observation{\n\t\tMap:        0,\n\t\tPartyCount: 1,\n\t\tParty: []PartyMon{{\n\t\t\tSpecies: "pidgey", Level: 16, HP: 20, MaxHP: 20,\n\t\t}},\n\t\tHasGrass:  true,\n\t\tWildGrass: []WildSpecies{{Name: "pidgey", MinLevel: 2, MaxLevel: 5, Slots: 10}},\n\t\tTraining: &TrainingEstimate{\n\t\t\tCurrentLevel: 16, TargetLevel: 18, XPRemaining: 1700,\n\t\t\tXPPerEncounter: 28, EstimatedEncounters: 61,\n\t\t\tSessionBudget: 20, Viability: TrainingOutsideBudget,\n\t\t},\n\t}\n\toffers := Offer(obs, NewKnowledge(map[uint8][]uint8{}))\n\tfor _, offer := range offers {\n\t\tif offer.Kind != KindTrain {\n\t\t\tcontinue\n\t\t}\n\t\tif !strings.Contains(offer.Note, "outside current session budget") || !strings.Contains(offer.Note, "~61 encounters") {\n\t\t\tt.Fatalf("training note = %q, want quantitative outside-budget evidence", offer.Note)\n\t\t}\n\t\treturn\n\t}\n\tt.Fatal("training objective was not offered")\n}\n'''
          new = '''func TestTrainingOfferWithholdsOutsideBudgetLeadTraining(t *testing.T) {\n\tobs := Observation{\n\t\tMap:        0,\n\t\tPartyCount: 1,\n\t\tParty: []PartyMon{{\n\t\t\tSpecies: "pidgey", Level: 16, HP: 20, MaxHP: 20,\n\t\t}},\n\t\tHasGrass:  true,\n\t\tWildGrass: []WildSpecies{{Name: "pidgey", MinLevel: 2, MaxLevel: 5, Slots: 10}},\n\t\tTraining: &TrainingEstimate{\n\t\t\tCurrentLevel: 16, TargetLevel: 18, XPRemaining: 1700,\n\t\t\tXPPerEncounter: 28, EstimatedEncounters: 61,\n\t\t\tSessionBudget: 20, Viability: TrainingOutsideBudget,\n\t\t},\n\t}\n\tfor _, offer := range Offer(obs, NewKnowledge(map[uint8][]uint8{})) {\n\t\tif offer.Kind == KindTrain {\n\t\t\tt.Fatalf("outside-budget training was offered: %+v", offer)\n\t\t}\n\t}\n}\n\nfunc TestTrainingOfferKeepsViableLeadTraining(t *testing.T) {\n\tobs := Observation{\n\t\tMap:        0,\n\t\tPartyCount: 1,\n\t\tParty: []PartyMon{{\n\t\t\tSpecies: "pidgey", Level: 16, HP: 20, MaxHP: 20,\n\t\t}},\n\t\tHasGrass:  true,\n\t\tWildGrass: []WildSpecies{{Name: "pidgey", MinLevel: 14, MaxLevel: 16, Slots: 10}},\n\t\tTraining: &TrainingEstimate{\n\t\t\tCurrentLevel: 16, TargetLevel: 18, XPRemaining: 500,\n\t\t\tXPPerEncounter: 100, EstimatedEncounters: 5,\n\t\t\tSessionBudget: 20, Viability: TrainingViable,\n\t\t},\n\t}\n\tfor _, offer := range Offer(obs, NewKnowledge(map[uint8][]uint8{})) {\n\t\tif offer.Kind == KindTrain && offer.Level == 18 {\n\t\t\tif !strings.Contains(offer.Note, "training viable") {\n\t\t\t\tt.Fatalf("training note = %q, want viability evidence", offer.Note)\n\t\t\t}\n\t\t\treturn\n\t\t}\n\t}\n\tt.Fatal("viable lead training objective was not offered")\n}\n'''
          if s.count(old) != 1:
              raise SystemExit(f'test block match count={s.count(old)}')
          test.write_text(s.replace(old, new, 1))
          PY
          gofmt -w agent/offer.go agent/training_test.go
          go test ./agent -run 'TestTrainingOffer|TestTrainingEstimate|TestTrainingInefficiency'
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'PokePilot Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add agent/offer.go agent/training_test.go
          git commit -m 'fix: hide outside-budget lead training offers'
          git push origin HEAD:${GITHUB_REF_NAME}
