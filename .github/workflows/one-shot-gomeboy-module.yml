name: one-shot GomeBoy module migration

on:
  push:
    branches:
      - chore/direct-gomeboy-module

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/direct-gomeboy-module
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Migrate GomeBoy dependency
        shell: bash
        run: |
          set -euo pipefail
          old='github.com/thelolagemann/gomeboy'
          new='github.com/maestroi/gomeboy'
          mapfile -t files < <(git grep -Il "$old" || true)
          if ((${#files[@]})); then
            perl -pi -e "s#\Q$old\E#$new#g" "${files[@]}"
          fi
          go mod edit -dropreplace=github.com/maestroi/gomeboy || true
          go mod edit -droprequire=github.com/maestroi/gomeboy || true
          go get github.com/maestroi/gomeboy@f0a3b8ae89e8ea263738c0aad505d7ada113686c
          go mod tidy
          rm -f .github/workflows/one-shot-gomeboy-module.yml
          git diff --check
          if git grep -n "$old"; then
            echo 'old GomeBoy module path still present' >&2
            exit 1
          fi
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: depend on standalone GomeBoy module'
          git push origin HEAD:chore/direct-gomeboy-module
