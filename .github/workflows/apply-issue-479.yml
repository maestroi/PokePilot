name: Apply issue 479 fix

on:
  push:
    branches: [fix/issue-479-party-move-learning]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('skill/battle.go')
          s = p.read_text()
          pairs = [
              ('\t\t\ttriedForgets[bs.Moves[lastForgetSlot].ID] = true\n', '\t\t\tmoveID := learningMoveID(&mem, bs, lastForgetSlot)\n\t\t\ttriedForgets[moveID] = true\n'),
              ('\t\t\t\tfmt.Printf("zbat move-learn action=hm-rejected slot=%d move=%d\\n", lastForgetSlot, bs.Moves[lastForgetSlot].ID)\n', '\t\t\t\tfmt.Printf("zbat move-learn action=hm-rejected slot=%d move=%d\\n", lastForgetSlot, moveID)\n'),
              ('\t\t\tids := [4]uint8{bs.Moves[0].ID, bs.Moves[1].ID, bs.Moves[2].ID, bs.Moves[3].ID}\n', ''),
              ('\t\t\tdecision := decideNaturalMove(m.ROM(), bs.ActiveType1, bs.ActiveType2, ids, offered, triedForgets)\n', '\t\t\tdecision, partySlot := decideNaturalMoveFromPartyRAM(m.ROM(), &mem, bs, offered, triedForgets)\n'),
              ('\t\t\tpendingLearnPartySlot = int(m.Peek8(sym.PlayerMonNumber))\n', '\t\t\tpendingLearnPartySlot = partySlot\n'),
              ('\t\t\t\t\tids := [4]uint8{bs.Moves[0].ID, bs.Moves[1].ID, bs.Moves[2].ID, bs.Moves[3].ID}\n', ''),
              ('\t\t\t\t\tdecision := decideNaturalMove(m.ROM(), bs.ActiveType1, bs.ActiveType2, ids, offered, nil)\n', '\t\t\t\t\tdecision, _ := decideNaturalMoveFromPartyRAM(m.ROM(), &s, bs, offered, nil)\n'),
          ]
          for old, new in pairs:
              if s.count(old) != 1:
                  raise SystemExit(f'expected one match, found {s.count(old)} for {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          gofmt -w skill/battle.go skill/move_learning_live.go skill/move_learning_live_test.go
          go test ./skill -run 'TestLearningMonSnapshot|TestMoveLearning'
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'PokePilot Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add skill/battle.go skill/move_learning_live.go skill/move_learning_live_test.go
          git commit -m 'fix: use party RAM for natural move learning'
          git push origin HEAD:${GITHUB_REF_NAME}
