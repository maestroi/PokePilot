name: Format model experiments

on:
  push:
    branches:
      - feat/723-724-model-experiments

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format new Go files
        run: |
          gofmt -w \
            cmd/pokemodelhost/main_test.go \
            cmd/pokewall/model_experiments.go \
            cmd/pokewall/model_experiments_test.go \
            farm/experiment.go
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/pokemodelhost/main_test.go cmd/pokewall/model_experiments.go cmd/pokewall/model_experiments_test.go farm/experiment.go
          git commit -m "style: gofmt model experiment implementation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
