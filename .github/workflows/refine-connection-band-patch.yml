name: Refine connection-band patch

on:
  push:
    branches:
      - fix/connection-component-bands

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[connection-band-refined]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/connection-component-bands

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply refinement
        run: python3 .github/refine_connection_band_patch.py

      - name: Format
        run: gofmt -w world/graph.go world/connection_band.go world/connection_band_test.go

      - name: Focused ROM-free tests
        env:
          POKEMON_RED_ROM: ""
        run: go test -short -count=1 ./world ./skill

      - name: Commit refinement
        shell: bash
        run: |
          set -euo pipefail
          rm .github/refine_connection_band_patch.py
          rm .github/workflows/refine-connection-band-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make connection bands explicit [connection-band-refined]"
          git push origin HEAD:fix/connection-component-bands
