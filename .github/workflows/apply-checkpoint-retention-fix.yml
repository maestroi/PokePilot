name: Apply checkpoint retention fix

on:
  push:
    branches:
      - fix/checkpoint-artifact-retention

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply scoped retention fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_between(path, start_marker, end_marker, replacement):
              p = Path(path)
              s = p.read_text()
              start = s.index(start_marker)
              end = s.index(end_marker, start)
              p.write_text(s[:start] + replacement + s[end:])

          agent_evict = r'''func (c *checkpointRing) evict() error {
          	entries, err := os.ReadDir(c.dir)
          	if err != nil {
          		return fmt.Errorf("read %s: %w", c.dir, err)
          	}
          	names := make([]string, 0, len(entries))
          	stateSet := map[string]bool{}
          	for _, en := range entries {
          		name := en.Name()
          		// The agent ring owns only objective-boundary checkpoints. The farm
          		// flight recorder deliberately shares this directory for periodic and
          		// major-badge snapshots, but those have independent retention windows.
          		if strings.HasPrefix(name, "round-") && strings.HasSuffix(name, ".state") {
          			names = append(names, name)
          			stateSet[name] = true
          		}
          	}
          	// Only round-* knowledge belongs to this ring. In particular, never
          	// classify a major-badge sidecar as orphaned just because its state is
          	// managed by the farm retention window rather than stateSet above.
          	for _, en := range entries {
          		name := en.Name()
          		if !strings.HasPrefix(name, "round-") || !isKnowledgeName(name) {
          			continue
          		}
          		base := strings.TrimSuffix(strings.TrimSuffix(name, ".json"), fmt.Sprintf(".knowledge-v%d", memoryVersion))
          		if stateSet[base+".state"] {
          			continue
          		}
          		if err := os.Remove(filepath.Join(c.dir, name)); err != nil && !os.IsNotExist(err) {
          			return fmt.Errorf("evict %s: %w", name, err)
          		}
          	}
          	sort.Strings(names)
          	for _, n := range names[:max(0, len(names)-c.keep)] {
          		if err := os.Remove(filepath.Join(c.dir, n)); err != nil && !os.IsNotExist(err) {
          			return fmt.Errorf("evict %s: %w", n, err)
          		}
          		if err := os.Remove(knowledgePathForState(filepath.Join(c.dir, n))); err != nil && !os.IsNotExist(err) {
          			return fmt.Errorf("evict %s: %w", n, err)
          		}
          	}
          	return nil
          }

          '''
          replace_between(
              "agent/run.go",
              "func (c *checkpointRing) evict() error {",
              "// checkpointSlug renders an objective for a filename:",
              agent_evict + "// checkpointSlug renders an objective for a filename:",
          )

          runtime_block = r'''func (w *Wall) handleRuntimeDelete(res http.ResponseWriter, req *http.Request) {
          	runID := req.PathValue("id")
          	run, ok := w.snapshotRun(runID)
          	if ok && run.Status == statusDone {
          		if w.runArtifactsProtected(runID) {
          			writeJSON(res, http.StatusConflict, map[string]string{"error": "run is still required by an active resume lineage: " + runID})
          			return
          		}
          		attempts := run.Attempts
          		if attempts < 1 {
          			attempts = 1
          		}
          		if err := w.deleteLocalRunArtifacts(runID, attempts); err != nil {
          			writeJSON(res, http.StatusInternalServerError, map[string]string{"error": "delete local run artifacts: " + err.Error()})
          			return
          		}
          	}
          	w.handleDelete(res, req)
          }

          func finishDumpPaths(dumpsDir, runID string, attempts int) []string {
          	if attempts < 1 {
          		attempts = 1
          	}
          	paths := []string{filepath.Join(dumpsDir, safeDumpName(runID))}
          	for attempt := 2; attempt <= attempts; attempt++ {
          		paths = append(paths, filepath.Join(dumpsDir, fmt.Sprintf("%s-attempt-%d.json", safeBase(runID), attempt)))
          	}
          	return paths
          }

          func (w *Wall) deleteLocalFinishDumps(runID string, attempts int) error {
          	if w.dumpsDir == "" {
          		return nil
          	}
          	for _, path := range finishDumpPaths(w.dumpsDir, runID, attempts) {
          		if err := os.Remove(path); err != nil && !errors.Is(err, os.ErrNotExist) {
          			return err
          		}
          		objectiveReporterFor(w).complete(path)
          	}
          	return nil
          }

          func (w *Wall) deleteLocalCheckpointTree(runID string) error {
          	if w.dumpsDir == "" {
          		return nil
          	}
          	return os.RemoveAll(filepath.Join(w.dumpsDir, "checkpoints", safeBase(runID)))
          }

          func (w *Wall) deleteLocalRunArtifacts(runID string, attempts int) error {
          	return errors.Join(
          		w.deleteLocalFinishDumps(runID, attempts),
          		w.deleteLocalCheckpointTree(runID),
          	)
          }

          // liveCheckpointLineageLocked returns the run IDs whose checkpoint
          // trees are still part of recovery for an active run: every active run
          // itself plus every ResumeFromRunID ancestor it can still fall back to.
          // Caller holds w.mu.
          func (w *Wall) liveCheckpointLineageLocked() map[string]struct{} {
          	keep := make(map[string]struct{})
          	for _, t := range w.tiles {
          		if t == nil || t.Finished {
          			continue
          		}
          		if t.RunID != "" {
          			keep[t.RunID] = struct{}{}
          		}
          		seen := make(map[string]struct{})
          		for id := t.ResumeFromRunID; id != ""; {
          			if _, dup := seen[id]; dup {
          				break
          			}
          			seen[id] = struct{}{}
          			keep[id] = struct{}{}
          			parent := w.tiles[id]
          			if parent == nil {
          				break
          			}
          			id = parent.ResumeFromRunID
          		}
          	}
          	return keep
          }

          func (w *Wall) runArtifactsProtected(runID string) bool {
          	w.mu.Lock()
          	_, protected := w.liveCheckpointLineageLocked()[runID]
          	w.mu.Unlock()
          	return protected
          }

          const (
          	defaultArtifactRetention  = 24 * time.Hour
          	defaultArtifactSweepEvery = 15 * time.Minute
          )

          // RunArtifactRetention bounds local wall storage without touching any
          // checkpoint tree that an active run can still resume through. Finished
          // run artifacts are retained for maxAge for replay/debugging; orphaned
          // legacy artifacts use their filesystem mtime. A non-positive maxAge
          // disables retention.
          func (w *Wall) RunArtifactRetention(interval, maxAge time.Duration) {
          	if w.dumpsDir == "" || maxAge <= 0 {
          		return
          	}
          	if interval <= 0 {
          		interval = defaultArtifactSweepEvery
          	}
          	tick := time.NewTicker(interval)
          	defer tick.Stop()
          	for now := range tick.C {
          		if err := w.expireLocalArtifacts(now, maxAge); err != nil {
          			log.Printf("pokewall: local artifact retention: %v", err)
          		}
          	}
          }

          type retentionRun struct {
          	id              string
          	attempts        int
          	endedAt         time.Time
          	replayAvailable bool
          	pendingIssue    bool
          	protected       bool
          }

          func (w *Wall) expireLocalArtifacts(now time.Time, maxAge time.Duration) error {
          	if w.dumpsDir == "" || maxAge <= 0 {
          		return nil
          	}
          	cutoff := now.Add(-maxAge)

          	w.mu.Lock()
          	lineage := w.liveCheckpointLineageLocked()
          	pendingRuns := make(map[string]struct{})
          	for _, entry := range w.outbox {
          		if entry.Status == outboxPending {
          			pendingRuns[entry.RunID] = struct{}{}
          		}
          	runs := make([]retentionRun, 0, len(w.tiles))
          	knownDumpNames := make(map[string]struct{})
          	knownCheckpointBases := make(map[string]struct{})
          	for id, t := range w.tiles {
          		if t == nil {
          			continue
          		}
          		attempts := t.Attempts
          		if attempts < 1 {
          			attempts = 1
          		}
          		for _, path := range finishDumpPaths(w.dumpsDir, id, attempts) {
          			knownDumpNames[filepath.Base(path)] = struct{}{}
          		}
          		knownCheckpointBases[safeBase(id)] = struct{}{}
          		if !t.Finished {
          			continue
          		}
          		_, pending := pendingRuns[id]
          		_, protected := lineage[id]
          		runs = append(runs, retentionRun{
          			id: id, attempts: attempts, endedAt: t.EndedAt,
          			replayAvailable: t.ReplayAvailable,
          			pendingIssue: pending, protected: protected,
          		})
          	}
          	w.mu.Unlock()

          	coordinator := objectiveReporterFor(w)
          	coordinator.mu.Lock()
          	pendingPaths := make(map[string]struct{}, len(coordinator.pending))
          	for path := range coordinator.pending {
          		pendingPaths[path] = struct{}{}
          	}
          	coordinator.mu.Unlock()

          	var errs []error
          	stateChanged := false
          	for _, run := range runs {
          		if run.protected || run.pendingIssue || run.endedAt.IsZero() || run.endedAt.After(cutoff) {
          			continue
          		}
          		pending := false
          		for _, path := range finishDumpPaths(w.dumpsDir, run.id, run.attempts) {
          			if _, ok := pendingPaths[path]; ok {
          				pending = true
          				break
          			}
          		}
          		if pending {
          			continue
          		}

          		dumpErr := w.deleteLocalFinishDumps(run.id, run.attempts)
          		if dumpErr != nil {
          			errs = append(errs, fmt.Errorf("finish dumps %s: %w", run.id, dumpErr))
          		} else if run.replayAvailable {
          			w.mu.Lock()
          			if cur := w.tiles[run.id]; cur != nil && cur.Finished && cur.EndedAt.Equal(run.endedAt) && cur.ReplayAvailable {
          				cur.ReplayAvailable = false
          				stateChanged = true
          			}
          			w.mu.Unlock()
          		}
          		if err := w.deleteLocalCheckpointTree(run.id); err != nil {
          			errs = append(errs, fmt.Errorf("checkpoint tree %s: %w", run.id, err))
          		}
          	}

          	// Clean artifacts left behind by older wall versions after their tile
          	// was manually deleted. Known runs are handled above; unknown artifacts
          	// are expired by mtime so a recent operator action never loses evidence.
          	if entries, err := os.ReadDir(w.dumpsDir); err != nil {
          		errs = append(errs, err)
          	} else {
          		for _, entry := range entries {
          			if entry.IsDir() || !strings.HasSuffix(entry.Name(), ".json") {
          				continue
          			}
          			if _, known := knownDumpNames[entry.Name()]; known {
          				continue
          			}
          			path := filepath.Join(w.dumpsDir, entry.Name())
          			if _, pending := pendingPaths[path]; pending {
          				continue
          			}
          			info, err := entry.Info()
          			if err != nil {
          				errs = append(errs, err)
          				continue
          			}
          			if info.ModTime().After(cutoff) {
          				continue
          			}
          			if err := os.Remove(path); err != nil && !errors.Is(err, os.ErrNotExist) {
          				errs = append(errs, fmt.Errorf("orphan dump %s: %w", entry.Name(), err))
          				continue
          			}
          			coordinator.complete(path)
          		}
          	}

          	checkpointRoot := filepath.Join(w.dumpsDir, "checkpoints")
          	if entries, err := os.ReadDir(checkpointRoot); err != nil && !errors.Is(err, os.ErrNotExist) {
          		errs = append(errs, err)
          	} else if err == nil {
          		for _, entry := range entries {
          			if !entry.IsDir() {
          				continue
          			}
          			if _, known := knownCheckpointBases[entry.Name()]; known {
          				continue
          			}
          			info, err := entry.Info()
          			if err != nil {
          				errs = append(errs, err)
          				continue
          			}
          			if info.ModTime().After(cutoff) {
          				continue
          			}
          			if err := os.RemoveAll(filepath.Join(checkpointRoot, entry.Name())); err != nil {
          				errs = append(errs, fmt.Errorf("orphan checkpoint tree %s: %w", entry.Name(), err))
          			}
          		}
          	}

          	if stateChanged {
          		w.saveState()
          	}
          	return errors.Join(errs...)
          }

          '''
          replace_between(
              "cmd/pokewall/runtime_followup.go",
              "func (w *Wall) handleRuntimeDelete(res http.ResponseWriter, req *http.Request) {",
              "type objectiveReporterCoordinator struct {",
              runtime_block + "type objectiveReporterCoordinator struct {",
          )

          main = Path("cmd/pokewall/main.go")
          s = main.read_text()
          needle = '\tstateFile := flag.String("state", "", "if set, persist the tile map and queue here so a wall restart does not forget active runs")\n'
          replacement = needle + '\tartifactRetention := flag.Duration("artifact-retention", defaultArtifactRetention, "how long finished-run dumps/checkpoints are kept locally; <=0 disables automatic retention")\n\tartifactRetentionEvery := flag.Duration("artifact-retention-every", defaultArtifactSweepEvery, "how often local finished-run artifacts are expired")\n'
          if needle not in s:
              raise SystemExit("main.go state flag anchor not found")
          s = s.replace(needle, replacement, 1)
          needle = '\tgo wall.RunReaper(5 * time.Second)\n'
          replacement = needle + '\tif *artifactRetention > 0 {\n\t\tgo wall.RunArtifactRetention(*artifactRetentionEvery, *artifactRetention)\n\t}\n'
          if needle not in s:
              raise SystemExit("main.go reaper anchor not found")
          s = s.replace(needle, replacement, 1)
          main.write_text(s)

          Path("agent/checkpoint_ring_scope_test.go").write_text(r'''package agent

          import (
          	"os"
          	"path/filepath"
          	"testing"
          )

          func writeCheckpointRingFixture(t *testing.T, path string) {
          	t.Helper()
          	if err := os.WriteFile(path, []byte("x"), 0o644); err != nil {
          		t.Fatalf("write %s: %v", path, err)
          	}
          }

          func requireCheckpointFile(t *testing.T, path string, want bool) {
          	t.Helper()
          	_, err := os.Stat(path)
          	if want && err != nil {
          		t.Fatalf("expected %s to survive: %v", path, err)
          	}
          	if !want && !os.IsNotExist(err) {
          		t.Fatalf("expected %s to be evicted, stat err=%v", path, err)
          	}
          }

          func TestCheckpointRingEvictsOnlyRoundCheckpoints(t *testing.T) {
          	dir := t.TempDir()
          	oldRound := filepath.Join(dir, "round-001-frame-0000000001-old.state")
          	newRound := filepath.Join(dir, "round-002-frame-0000000002-new.state")
          	periodic := filepath.Join(dir, "periodic-0000000003.state")
          	periodicMeta := filepath.Join(dir, "periodic-0000000003.json")
          	major := filepath.Join(dir, "major-badge-1-round-002-frame-0000000002-test.state")
          	majorKnowledge := knowledgePathForState(major)
          	orphanRoundKnowledge := knowledgePathForState(filepath.Join(dir, "round-000-frame-0000000000-orphan.state"))

          	for _, path := range []string{
          		oldRound, knowledgePathForState(oldRound),
          		newRound, knowledgePathForState(newRound),
          		periodic, periodicMeta,
          		major, majorKnowledge,
          		orphanRoundKnowledge,
          	} {
          		writeCheckpointRingFixture(t, path)
          	}

          	ring := checkpointRing{dir: dir, keep: 1}
          	if err := ring.evict(); err != nil {
          		t.Fatalf("evict: %v", err)
          	}

          	requireCheckpointFile(t, oldRound, false)
          	requireCheckpointFile(t, knowledgePathForState(oldRound), false)
          	requireCheckpointFile(t, newRound, true)
          	requireCheckpointFile(t, knowledgePathForState(newRound), true)
          	requireCheckpointFile(t, orphanRoundKnowledge, false)
          	requireCheckpointFile(t, periodic, true)
          	requireCheckpointFile(t, periodicMeta, true)
          	requireCheckpointFile(t, major, true)
          	requireCheckpointFile(t, majorKnowledge, true)
          }
          ''')

          Path("cmd/pokewall/artifact_retention_test.go").write_text(r'''package main

          import (
          	"net/http"
          	"net/http/httptest"
          	"os"
          	"path/filepath"
          	"testing"
          	"time"
          )

          func writeRetentionFixture(t *testing.T, path string) {
          	t.Helper()
          	if err := os.MkdirAll(filepath.Dir(path), 0o755); err != nil {
          		t.Fatal(err)
          	}
          	if err := os.WriteFile(path, []byte("x"), 0o644); err != nil {
          		t.Fatal(err)
          	}
          }

          func TestRuntimeDeleteRemovesCheckpointTree(t *testing.T) {
          	dir := t.TempDir()
          	w := NewWall(dir)
          	w.mu.Lock()
          	w.order = []string{"run-clean"}
          	w.tiles["run-clean"] = &Tile{RunID: "run-clean", Status: statusDone, Finished: true, Attempts: 2}
          	w.mu.Unlock()

          	for _, path := range finishDumpPaths(dir, "run-clean", 2) {
          		writeRetentionFixture(t, path)
          	}
          	checkpoint := filepath.Join(checkpointAttemptDir(dir, "run-clean", 2), "round-001.state")
          	writeRetentionFixture(t, checkpoint)

          	req := httptest.NewRequest(http.MethodDelete, "/v1/runs/run-clean", nil)
          	req.SetPathValue("id", "run-clean")
          	rec := httptest.NewRecorder()
          	w.handleRuntimeDelete(rec, req)
          	if rec.Code != http.StatusOK {
          		t.Fatalf("delete status=%d body=%s", rec.Code, rec.Body.String())
          	}
          	if _, err := os.Stat(filepath.Join(dir, "checkpoints", safeBase("run-clean"))); !os.IsNotExist(err) {
          		t.Fatalf("checkpoint tree still exists: %v", err)
          	}
          }

          func TestRuntimeDeleteProtectsLiveResumeParent(t *testing.T) {
          	dir := t.TempDir()
          	w := NewWall(dir)
          	w.mu.Lock()
          	w.order = []string{"parent", "child"}
          	w.tiles["parent"] = &Tile{RunID: "parent", Status: statusDone, Finished: true, Attempts: 1}
          	w.tiles["child"] = &Tile{RunID: "child", Status: statusQueued, Endless: true, ResumeFromRunID: "parent"}
          	w.mu.Unlock()
          	checkpoint := filepath.Join(checkpointAttemptDir(dir, "parent", 1), "major-badge-1.state")
          	writeRetentionFixture(t, checkpoint)
          	writeRetentionFixture(t, filepath.Join(dir, safeDumpName("parent")))

          	req := httptest.NewRequest(http.MethodDelete, "/v1/runs/parent", nil)
          	req.SetPathValue("id", "parent")
          	rec := httptest.NewRecorder()
          	w.handleRuntimeDelete(rec, req)
          	if rec.Code != http.StatusConflict {
          		t.Fatalf("delete status=%d body=%s", rec.Code, rec.Body.String())
          	}
          	if _, ok := w.snapshotRun("parent"); !ok {
          		t.Fatal("protected resume parent was removed from wall state")
          	}
          	if _, err := os.Stat(checkpoint); err != nil {
          		t.Fatalf("protected checkpoint was removed: %v", err)
          	}
          }

          func TestExpireLocalArtifactsKeepsRecentAndLiveLineage(t *testing.T) {
          	dir := t.TempDir()
          	w := NewWall(dir)
          	now := time.Date(2026, 9, 11, 12, 0, 0, 0, time.UTC)
          	old := now.Add(-25 * time.Hour)
          	recent := now.Add(-23 * time.Hour)
          	parentOld := now.Add(-48 * time.Hour)

          	w.mu.Lock()
          	w.order = []string{"old", "recent", "parent", "child"}
          	w.tiles["old"] = &Tile{RunID: "old", Status: statusDone, Finished: true, Attempts: 2, EndedAt: old, ReplayAvailable: true}
          	w.tiles["recent"] = &Tile{RunID: "recent", Status: statusDone, Finished: true, Attempts: 1, EndedAt: recent, ReplayAvailable: true}
          	w.tiles["parent"] = &Tile{RunID: "parent", Status: statusDone, Finished: true, Attempts: 1, EndedAt: parentOld, ReplayAvailable: true}
          	w.tiles["child"] = &Tile{RunID: "child", Status: statusRunning, Endless: true, ResumeFromRunID: "parent"}
          	w.mu.Unlock()

          	for _, id := range []string{"old", "recent", "parent"} {
          		run, _ := w.snapshotRun(id)
          		for _, path := range finishDumpPaths(dir, id, max(1, run.Attempts)) {
          			writeRetentionFixture(t, path)
          		}
          		writeRetentionFixture(t, filepath.Join(checkpointAttemptDir(dir, id, 1), "round-001.state"))
          	}
          	orphanDump := filepath.Join(dir, "orphan.json")
          	writeRetentionFixture(t, orphanDump)
          	if err := os.Chtimes(orphanDump, old, old); err != nil {
          		t.Fatal(err)
          	}
          	orphanTree := filepath.Join(dir, "checkpoints", "orphan")
          	writeRetentionFixture(t, filepath.Join(orphanTree, "1", "round.state"))
          	if err := os.Chtimes(orphanTree, old, old); err != nil {
          		t.Fatal(err)
          	}

          	if err := w.expireLocalArtifacts(now, 24*time.Hour); err != nil {
          		t.Fatalf("expire: %v", err)
          	}

          	for _, path := range finishDumpPaths(dir, "old", 2) {
          		if _, err := os.Stat(path); !os.IsNotExist(err) {
          			t.Fatalf("old dump still exists %s: %v", path, err)
          		}
          	}
          	if _, err := os.Stat(filepath.Join(dir, "checkpoints", safeBase("old"))); !os.IsNotExist(err) {
          		t.Fatalf("old checkpoint tree still exists: %v", err)
          	}
          	oldRun, _ := w.snapshotRun("old")
          	if oldRun.ReplayAvailable {
          		t.Fatal("expired run still advertises replay")
          	}

          	for _, id := range []string{"recent", "parent"} {
          		if _, err := os.Stat(filepath.Join(dir, safeDumpName(id))); err != nil {
          			t.Fatalf("%s dump should survive: %v", id, err)
          		}
          		if _, err := os.Stat(filepath.Join(dir, "checkpoints", safeBase(id))); err != nil {
          			t.Fatalf("%s checkpoint tree should survive: %v", id, err)
          		}
          	}
          	if _, err := os.Stat(orphanDump); !os.IsNotExist(err) {
          		t.Fatalf("orphan dump still exists: %v", err)
          	}
          	if _, err := os.Stat(orphanTree); !os.IsNotExist(err) {
          		t.Fatalf("orphan checkpoint tree still exists: %v", err)
          	}
          }
          ''')
          PY
          gofmt -w agent/run.go agent/checkpoint_ring_scope_test.go cmd/pokewall/runtime_followup.go cmd/pokewall/main.go cmd/pokewall/artifact_retention_test.go
          go test ./agent ./cmd/pokewall
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/run.go agent/checkpoint_ring_scope_test.go cmd/pokewall/runtime_followup.go cmd/pokewall/main.go cmd/pokewall/artifact_retention_test.go
          git commit -m "fix checkpoint eviction and wall artifact retention"
          git push origin HEAD:${{ github.ref_name }}
