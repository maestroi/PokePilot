name: issue313-verify

on:
  push:
    branches:
      - fix/313-wall-sqlite-catalog

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Apply integration edits
        run: python hack/issue313_patch.py

      - name: Format and resolve modules
        run: |
          gofmt -w cmd/pokewall/catalog.go cmd/pokewall/catalog_test.go cmd/pokewall/main.go cmd/pokewall/snapshot_perf.go cmd/pokewall/artifact_retention.go cmd/pokeui/outcomes_stats.go cmd/pokeui/outcomes_stats_test.go cmd/pokeui/main.go
          go mod tidy

      - name: ROM-free verification
        run: |
          go test ./cmd/pokewall ./cmd/pokeui ./deploy
          make test-short

      - name: Commit verified implementation
        run: |
          rm .github/workflows/issue313-verify.yml hack/issue313_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "wall: persist run catalog in SQLite (#313)"
          git push origin HEAD:${GITHUB_REF_NAME}
