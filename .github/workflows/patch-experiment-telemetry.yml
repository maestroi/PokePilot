name: Patch experiment telemetry

on:
  push:
    branches:
      - feat/723-724-model-experiments

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply patch
        run: python3 .github/tmp_patch_experiment.py
      - name: Format and test
        run: |
          gofmt -w agent/failover.go farm/spec.go farm/strategic_record.go cmd/pokepilot/stats.go cmd/pokewall/model_experiments.go
          go test ./agent ./farm ./cmd/pokepilot ./cmd/pokewall
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/failover.go farm/spec.go farm/strategic_record.go cmd/pokepilot/stats.go cmd/pokewall/model_experiments.go
          git commit -m "feat(experiments): retain strategist trajectories and quality metrics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
