name: Temporary revision gate patch

on:
  push:
    branches:
      - fix/revision-aware-issue-reopen

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/revision-aware-issue-reopen
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Patch recurrence handling
        shell: python
        run: |
          from pathlib import Path

          path = Path('cmd/pokeissues/main.go')
          text = path.read_text()

          old = '''\tif found {
          \t\tif strings.EqualFold(existing.State, "closed") && !strings.EqualFold(existing.StateReason, "not_planned") {
          \t\t\tif err := c.reopenIssue(ctx, existing.Number); err != nil {
          \t\t\t\treturn out, false, err
          \t\t\t}
          \t\t\tif err := c.ensureOccurrenceComment(ctx, existing.Number, manifest, artifacts); err != nil {
          \t\t\t\treturn out, false, err
          \t\t\t}
          \t\t\texisting.State = "open"
          \t\t\texisting.StateReason = "reopened"
          \t\t}
          \t\treturn reportResponse(existing, manifest.ExternalID, true), false, nil
          \t}
          '''
          new = '''\tif found {
          \t\tif strings.EqualFold(existing.State, "closed") && !strings.EqualFold(existing.StateReason, "not_planned") {
          \t\t\tfixedRevision, stale, gateErr := c.staleRecurrence(ctx, existing.Number, manifest.ObservedRevision)
          \t\t\tif gateErr == nil && stale {
          \t\t\t\tif err := c.ensureStaleOccurrenceComment(ctx, existing.Number, manifest, artifacts, fixedRevision); err != nil {
          \t\t\t\t\treturn out, false, err
          \t\t\t\t}
          \t\t\t\tresult := reportResponse(existing, manifest.ExternalID, true)
          \t\t\t\tresult.Automation.Warning = fmt.Sprintf("stale occurrence on revision %s predates resolution baseline %s; issue left closed", manifest.ObservedRevision, fixedRevision)
          \t\t\t\treturn result, false, nil
          \t\t\t}
          \t\t\t// If the closure baseline or ancestry lookup fails, preserve the old
          \t\t\t// fail-open behavior: a possible real regression is safer to reopen.
          \t\t\tif err := c.reopenIssue(ctx, existing.Number); err != nil {
          \t\t\t\treturn out, false, err
          \t\t\t}
          \t\t\tif err := c.ensureOccurrenceComment(ctx, existing.Number, manifest, artifacts); err != nil {
          \t\t\t\treturn out, false, err
          \t\t\t}
          \t\t\texisting.State = "open"
          \t\t\texisting.StateReason = "reopened"
          \t\t}
          \t\treturn reportResponse(existing, manifest.ExternalID, true), false, nil
          \t}
          '''
          if text.count(old) != 1:
              raise SystemExit(f'report block matches: {text.count(old)}')
          text = text.replace(old, new)

          old = '''\tif strings.EqualFold(issue.State, "closed") {
          \t\tif strings.EqualFold(issue.StateReason, "not_planned") {
          \t\t\tout.Resolution = "not_planned"
          \t\t} else {
          \t\t\tout.Resolution = "fixed"
          \t\t}
          \t}
          '''
          new = '''\tif strings.EqualFold(issue.State, "closed") {
          \t\tif strings.EqualFold(issue.StateReason, "not_planned") {
          \t\t\tout.Resolution = "not_planned"
          \t\t} else {
          \t\t\tout.Resolution = "fixed"
          \t\t\t// Publish the same frozen baseline PokéWall uses for regression
          \t\t\t// diagnostics. Failure to resolve it must not break lifecycle sync.
          \t\t\tif fixedRevision, err := c.fixedRevisionAtClose(ctx, issue.Number); err == nil {
          \t\t\t\tout.FixedRevision = fixedRevision
          \t\t\t}
          \t\t}
          \t}
          '''
          if text.count(old) != 1:
              raise SystemExit(f'status block matches: {text.count(old)}')
          path.write_text(text.replace(old, new))
      - name: Format and test
        run: |
          gofmt -w cmd/pokeissues/main.go cmd/pokeissues/revision_gate.go cmd/pokeissues/revision_gate_test.go
          go test ./cmd/pokeissues
      - name: Commit generated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-revision-gate-patch.yml
          git add cmd/pokeissues/main.go cmd/pokeissues/revision_gate.go cmd/pokeissues/revision_gate_test.go
          git commit -m 'fix(pokeissues): ignore stale pre-fix recurrences'
          git push origin HEAD:fix/revision-aware-issue-reopen
