name: Implement issue 146

on:
  push:
    branches: [codex/issue-146-semantic-transition-execution]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-146-semantic-transition-execution
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply implementation
        run: python3 implement_146.py
      - name: Format and verify
        env:
          POKEMON_RED_ROM: ""
        run: |
          gofmt -w world/route.go world/semantic_route.go world/grid.go world/semantic_route_execution_test.go skill/live_topology.go skill/goto.go skill/travel.go skill/route_transition.go skill/route_transition_test.go skill/route_transition_real_test.go
          git diff --check
          go mod download
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test -short -count=1 ./...
          go test -race -short -count=1 ./...
      - name: Commit verified implementation
        run: |
          rm implement_146.py .github/workflows/implement-146.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "navigation: execute semantic route transitions (#146)"
          git push origin HEAD:codex/issue-146-semantic-transition-execution
