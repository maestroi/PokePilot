name: One-shot gofmt

on:
  push:
    branches: [chore/gofmt-gate]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/gofmt-gate

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Apply gofmt and commit
        run: |
          files="$(gofmt -l .)"
          if [ -z "$files" ]; then
            exit 0
          fi
          gofmt -w $files
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.go'
          git commit -m "chore: gofmt repository"
          git push origin HEAD:chore/gofmt-gate
