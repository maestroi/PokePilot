# Headless farm fixer. Separate stack from pokefarm so a farm rollout does
# not kill a repair that is still pushing a branch.
#
#   docker node update --label-add pokepilot.fixer=true <node>
#   make fixer-up
#
# The labeled node must be the one whose disk holds POKEPILOT_ROM_DIR and
# FIXER_STATE_DIR. Bind mounts, not named volumes: a named volume on this
# swarm comes up empty on task rollover.
#
# Replicas run the same ladder in parallel. Each keeps its own checkout,
# triage tree and lock under slot-N; all share the ledger (tier budgets, paid
# cap), the claims dir (no two replicas on one key) and the qwen lock (one
# opencode attempt at a time; the other replica takes Cursor auto).
#
# POKEPILOT_FIXER_CURSOR_API_KEY is a user API key. A key from a second
# Cursor account spends that account's allowance, not the desktop login.
# POKEPILOT_FIXER_GITHUB_TOKEN needs contents, issues, and pull requests
# on the repo. git push uses that token over HTTPS; an SSH key is not used.

services:
  fixer:
    image: ${FIXER_IMAGE:-pokepilot-fixer:local}
    environment:
      POKEPILOT_GITHUB_REPO: ${POKEPILOT_GITHUB_REPO:-maestroi/PokePilot}
      POKEPILOT_FIXER_GITHUB_TOKEN: ${POKEPILOT_FIXER_GITHUB_TOKEN:?POKEPILOT_FIXER_GITHUB_TOKEN is required}
      POKEPILOT_FIXER_CURSOR_API_KEY: ${POKEPILOT_FIXER_CURSOR_API_KEY:?POKEPILOT_FIXER_CURSOR_API_KEY is required}
      POKEPILOT_MCP_TOKEN: ${POKEPILOT_MCP_TOKEN:?POKEPILOT_MCP_TOKEN is required}
      POKEPILOT_MCP_URL: ${POKEPILOT_MCP_URL:-https://admin.rompilot.app/mcp}
      POKEPILOT_TRIAGE_AGENT: ladder
      POKEPILOT_TRIAGE_LADDER: ${POKEPILOT_TRIAGE_LADDER:-opencode:2,cursor:2,cursor/claude-opus-5-5-high:2}
      POKEPILOT_PAID_DAILY_CAP: ${POKEPILOT_PAID_DAILY_CAP:-20}
      POKEPILOT_CURSOR_MODEL: ${POKEPILOT_CURSOR_MODEL:-auto}
      POKEPILOT_QWEN_URL: ${POKEPILOT_QWEN_URL:?POKEPILOT_QWEN_URL is required (llama.cpp /v1 base serving qwen)}
      POKEPILOT_OPENCODE_MODEL: ${POKEPILOT_OPENCODE_MODEL:-qwen3.8-27b/qwen3.8-27b}
      POKEPILOT_FIXER_INTERVAL: ${POKEPILOT_FIXER_INTERVAL:-2m}
      POKEMON_RED_ROM: /rom/pokemon_red.gb
      POKEPILOT_ROOT: /var/lib/pokefixer/slot-{{.Task.Slot}}/source
      POKEPILOT_TRIAGE_TREE: /var/lib/pokefixer/slot-{{.Task.Slot}}/work
      POKEPILOT_TRIAGE_STATE: /var/lib/pokefixer/slot-{{.Task.Slot}}/state
      POKEPILOT_TRIAGE_LEDGER: /var/lib/pokefixer/ledger.tsv
      POKEPILOT_TRIAGE_CLAIMS: /var/lib/pokefixer/claims
      POKEPILOT_QWEN_LOCK: /var/lib/pokefixer/qwen.lock
      GOCACHE: /var/lib/pokefixer/gocache
      GOMODCACHE: /var/lib/pokefixer/gomodcache
      GIT_AUTHOR_NAME: ${POKEPILOT_FIXER_GIT_NAME:-pokefixer}
      GIT_AUTHOR_EMAIL: ${POKEPILOT_FIXER_GIT_EMAIL:-pokefixer@users.noreply.github.com}
    volumes:
      - ${POKEPILOT_ROM_DIR:?POKEPILOT_ROM_DIR is required}:/rom:ro
      - ${FIXER_STATE_DIR:?FIXER_STATE_DIR is required}:/var/lib/pokefixer
    stop_grace_period: 60s
    deploy:
      replicas: ${FIXER_REPLICAS:-2}
      restart_policy:
        condition: any
        delay: 30s
      placement:
        constraints:
          - node.labels.pokepilot.fixer == true
      resources:
        reservations:
          memory: 1G
        limits:
          memory: 8G
