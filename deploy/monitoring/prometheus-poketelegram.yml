# Prometheus scrape job for the PokePilot Telegram operator (cmd/poketelegram).
#
# The bot's metrics listener is deliberately NOT published to the host: it is
# only reachable from the farm overlay network. Prometheus therefore has to run
# on that same network (the `pokefarm_default` overlay created by
# deploy/farm.yml) — it does not need the Docker socket for this job.
#
# This file is a scrape_configs *entry*, not a complete prometheus.yml. Merge it
# into the `scrape_configs:` list of your Prometheus configuration:
#
#   scrape_configs:
#     - job_name: existing
#       ...
#     - job_name: poketelegram      # <- the block below, de-indented to match
#       ...
#
# Swarm gives each service an aggregate DNS name `tasks.<service>`, which
# resolves to every running task of that service. The Telegram service is named
# `telegram` (see deploy/telegram.yml), so `tasks.telegram` works without a
# Docker socket and without a service-discovery relabel chain.
- job_name: poketelegram
  metrics_path: /metrics
  dns_sd_configs:
    - names:
        - tasks.telegram
      type: A
      port: 8080
  relabel_configs:
    # Keep the discovered address as the instance label so a task replacement
    # is visible in Grafana rather than silently reusing the old series.
    - source_labels: [__address__]
      target_label: instance
    - source_labels: [__meta_dns_name]
      target_label: swarm_dns_name

# Alternative for a Prometheus that already uses Docker Swarm service discovery
# and has the Docker socket mounted. Drop the dns_sd_configs block above and use
# this instead; it relies on the `prometheus.scrape` deploy label documented in
# deploy/monitoring/README.md.
#
#   dockerswarm_sd_configs:
#     - host: unix:///var/run/docker.sock
#       role: tasks
#   relabel_configs:
#     - source_labels: [__meta_dockerswarm_service_label_prometheus_scrape]
#       regex: "true"
#       action: keep
#     - source_labels: [__meta_dockerswarm_service_label_prometheus_port]
#       regex: "(.+)"
#       target_label: __meta_prometheus_port
#     # Swarm SD discovers the node address; a task on an overlay network is
#     # reachable by the task DNS name instead.
#     - source_labels: [__meta_dockerswarm_service_name, __meta_prometheus_port]
#       regex: "(.+);(.+)"
#       replacement: "tasks.${1}:${2}"
#       target_label: __address__
