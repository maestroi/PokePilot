# PokePilot's inference gateway. The application chooses a logical model group;
# LiteLLM owns the physical backend and failover policy.
#
# Auto deliberately prefers the dedicated/slower 7900 XTX, then borrows the
# 4090, then falls back to the LAN CPU model. The other model groups are escape
# hatches used by the Operator console to reserve coding GPUs.
model_list:
  - model_name: pokepilot-auto
    litellm_params:
      model: os.environ/POKEPILOT_LITELLM_7900_MODEL
      api_base: os.environ/POKEPILOT_LITELLM_7900_URL
      api_key: local
      allowed_openai_params: ["reasoning_effort", "chat_template_kwargs"]

  - model_name: pokepilot-7900xtx
    litellm_params:
      model: os.environ/POKEPILOT_LITELLM_7900_MODEL
      api_base: os.environ/POKEPILOT_LITELLM_7900_URL
      api_key: local
      allowed_openai_params: ["reasoning_effort", "chat_template_kwargs"]

  - model_name: pokepilot-4090
    litellm_params:
      model: os.environ/POKEPILOT_LITELLM_4090_MODEL
      api_base: os.environ/POKEPILOT_LITELLM_4090_URL
      api_key: local
      allowed_openai_params: ["reasoning_effort", "chat_template_kwargs"]

  - model_name: pokepilot-lan
    litellm_params:
      model: os.environ/POKEPILOT_LITELLM_LAN_MODEL
      api_base: os.environ/POKEPILOT_LITELLM_LAN_URL
      api_key: os.environ/POKEPILOT_LITELLM_LAN_KEY
      allowed_openai_params: ["reasoning_effort", "chat_template_kwargs"]

router_settings:
  # The backend servers are already local and PokePilot has its own bounded
  # planner retries. Avoid replaying a request repeatedly on one dead server;
  # move to the next resource instead.
  num_retries: 0
  allowed_fails: 1
  cooldown_time: 30
  fallbacks:
    - pokepilot-auto: [pokepilot-4090, pokepilot-lan]

litellm_settings:
  request_timeout: 300
  # PokePilot sends llama.cpp extension fields such as chat_template_kwargs.
  # The backends must be hosted_vllm/*, not openai/*: the OpenAI SDK provider
  # strips unknown top-level fields even with allowed_openai_params, which
  # leaves Qwen 3.8 on its default xhigh thinking path. openai_like/* is
  # unmapped on the LiteLLM 1.99 proxy chat route.
  drop_params: false
