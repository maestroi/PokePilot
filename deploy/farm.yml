# Local single-node Swarm smoke test (docs/archive/2026-08-26-farm-design.md
# section 6 and docs/archive/2026-08-29-pokefarm-wall-ui-design.md). Deploy
# with:
#
#   docker stack deploy --resolve-image never -c deploy/farm.yml pokefarm
#
# `--resolve-image never` lets a single-node Swarm use the image that
# `make farm-image` loaded locally. On a MULTI-NODE swarm the nodes cannot
# see each other's local image store, so the image must be published to a
# registry and FARM_IMAGE pointed at that reference instead; this stack
# file intentionally contains no build: keys because `docker stack deploy`
# does not build images.
#
# The ROM is never baked into the image: runner, replay and virtual-trader tasks
# bind-mount the operator's ${POKEPILOT_ROM_DIR} read-only at /rom and read
# individual cartridges back as /rom/pokemon_red.gb, /rom/pokemon_blue.gb, ...
# Which game a file is comes from its bytes (profiles.Detect), not its name, so
# dropping a third cartridge into that directory needs no code or deploy change.
#
# pokeui is in the stack twice: `ui` is the private operator console, while
# `spectator` is a separate process with a server-side read-only route table.
# The wall publishes no host ports; in-network debugging is still
# http://wall:8080 (HTML table + /frame).

configs:
  litellm_config:
    file: ./litellm.yaml
  model_registry:
    file: ./models.json

services:
  wall:
    image: ${FARM_IMAGE:-pokepilot-farm:local}
    # -state persists the tile map and queue, so a rolled wall remembers
    # active runs (their heartbeats resume within a second of its return);
    # the reaper then clears any run whose runner truly died.
    # PokéWall keeps its durable issue protocol, but the endpoint below is the
    # in-stack GitHub adapter rather than the private Agent Orchestrator.
    command:
      - pokewall
      - -http
      - ":8080"
      - -dumps
      - /var/lib/pokewall/dumps
      - -state
      - /var/lib/pokewall/state.json
      - -catalog
      - /var/lib/pokewall/catalog.db
      - -issues-api
      - "http://issues:8080"
      - -issues-project
      - "pokepilot"
      - -issues-ui
      - "https://github.com/${POKEPILOT_GITHUB_REPO:-maestroi/PokePilot}"
    environment:
      POKEPILOT_MODEL_REGISTRY: /etc/pokepilot/models.json
      POKEPILOT_MODELHOST_TOKEN: ${POKEPILOT_MODELHOST_TOKEN:-}
      # Paired benchmarks use these immutable identities to decide whether
      # two arms are actually comparable. Per-game hashes win over the
      # legacy generic hash so Red/Blue experiments cannot share the wrong ROM.
      POKEPILOT_ROM_SHA256: ${POKEPILOT_ROM_SHA256:-}
      POKEPILOT_ROM_SHA256_POKEMON_RED: ${POKEPILOT_ROM_SHA256_POKEMON_RED:-}
      POKEPILOT_ROM_SHA256_POKEMON_BLUE: ${POKEPILOT_ROM_SHA256_POKEMON_BLUE:-}
      POKEPILOT_PROMPT_SHA256: ${POKEPILOT_PROMPT_SHA256:-}
    configs:
      - source: model_registry
        target: /etc/pokepilot/models.json
    deploy:
      replicas: 1
      # 2G is a blast-radius cap (page cache + catalog), not the working set.
      # pokewall is ~256-340MB RSS; cgroup usage looks huge because dumps stay cached.
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 2G
    volumes:
      # Bind mount, NOT a named volume: on this host a named volume handed
      # to a swarm task comes up EMPTY on every task rollover (measured:
      # state written by one wall task is invisible to its replacement),
      # while bind-mounted host directories survive rollovers fine.
      - ${FARM_STATE_DIR}:/var/lib/pokewall

  issues:
    image: ${FARM_IMAGE:-pokepilot-farm:local}
    # GitHub is now the farm issue system of record. Only this adapter receives
    # the credential; PokéWall, runners, replay, and both UIs never see it.
    command: ["pokeissues", "-http", ":8080"]
    environment:
      POKEPILOT_GITHUB_REPO: ${POKEPILOT_GITHUB_REPO:-maestroi/PokePilot}
      POKEPILOT_GITHUB_TOKEN: ${POKEPILOT_GITHUB_TOKEN:-}
      # Used only to put a useful private run/debug link in the public issue.
      # The adapter never uploads save-state/frame/recording bytes to GitHub.
      POKEPILOT_RUN_BASE_URL: ${POKEPILOT_RUN_BASE_URL:-https://admin.rompilot.app}
    deploy:
      replicas: 1

  replay:
    image: ${FARM_IMAGE:-pokepilot-farm:local}
    # Replay is intentionally a separate trust boundary. It needs the ROM and
    # S3 credentials to verify/render .gbrun recordings; pokewall does not.
    command: ["pokereplay", "-http", ":8080", "-wall", "http://wall:8080", "-rom", "/rom/pokemon_red.gb"] # ponytail: Blue recordings still need a per-recording ROM picker; replay stays Red until then
    environment:
      POKEPILOT_S3_ENDPOINT: ${POKEPILOT_S3_ENDPOINT:-}
      POKEPILOT_S3_BUCKET: ${POKEPILOT_S3_BUCKET:-}
      POKEPILOT_S3_REGION: ${POKEPILOT_S3_REGION:-us-east-1}
      POKEPILOT_S3_ACCESS_KEY: ${POKEPILOT_S3_ACCESS_KEY:-}
      POKEPILOT_S3_SECRET_KEY: ${POKEPILOT_S3_SECRET_KEY:-}
      # Rendering a long recording can legitimately take longer than a normal
      # runner artifact PUT, so replay gets its own configurable S3 timeout.
      POKEPILOT_S3_TIMEOUT: ${POKEPILOT_REPLAY_S3_TIMEOUT:-10m}
      # auto: h264_vaapi when /dev/dri/renderD128 exists; set off for libx264.
      POKEPILOT_REPLAY_ENCODER: ${POKEPILOT_REPLAY_ENCODER:-auto}
      LIBVA_DRIVER_NAME: ${LIBVA_DRIVER_NAME:-iHD}
    volumes:
      - ${POKEPILOT_ROM_DIR}:/rom:ro
    deploy:
      replicas: 1

  ui:
    image: ${FARM_IMAGE:-pokepilot-farm:local}
    # Private operator only: same-origin proxy to wall metadata plus the replay
    # sidecar for artifact bytes/video. The public spectator never mounts these.
    command: ["pokeui", "-http", ":8080", "-wall", "http://wall:8080", "-replay", "http://replay:8080"]
    environment:
      # Empty disables /mcp entirely. Keep this operator service private even
      # when MCP is disabled: its HTTP UI can queue, cancel, and delete runs.
      POKEPILOT_MCP_TOKEN: ${POKEPILOT_MCP_TOKEN:-}
    ports:
      - target: 8080
        published: ${FARM_WALL_PORT:-18080}
        protocol: tcp
        mode: host
    deploy:
      replicas: 1

  spectator:
    image: ${FARM_IMAGE:-pokepilot-farm:local}
    # The public process still mounts only the sanitized spectator route table.
    # It can read cached replay status/video from the replay sidecar, but cannot
    # trigger renders, browse artifacts, inspect debug data, or mutate runs.
    command: ["pokeui", "-http", ":8080", "-wall", "http://wall:8080", "-replay", "http://replay:8080", "-spectator"]
    ports:
      - target: 8080
        published: ${FARM_SPECTATOR_PORT:-18081}
        protocol: tcp
        mode: host
    deploy:
      replicas: 1

  litellm:
    # Parked internal inference gateway. It stays deployed/configured so it can
    # be re-enabled for routing experiments, but runners bypass it unless
    # POKEPILOT_LLM_GATEWAY_URL is explicitly set.
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.99.1}
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      POKEPILOT_LITELLM_7900_URL: ${POKEPILOT_LITELLM_7900_URL:-http://192.168.50.130:8002/v1}
      POKEPILOT_LITELLM_7900_MODEL: ${POKEPILOT_LITELLM_7900_MODEL:-hosted_vllm/qwen3.8-27b}
      POKEPILOT_LITELLM_4090_URL: ${POKEPILOT_LITELLM_4090_URL:-http://192.168.50.81:8002/v1}
      POKEPILOT_LITELLM_4090_MODEL: ${POKEPILOT_LITELLM_4090_MODEL:-hosted_vllm/pokepilot-4090}
      POKEPILOT_LITELLM_LAN_URL: ${POKEPILOT_LITELLM_LAN_URL:-http://192.168.50.204:8000/v1}
      POKEPILOT_LITELLM_LAN_KEY: ${POKEPILOT_LITELLM_LAN_KEY:-${llm_token:-}}
      # The existing LAN server is qwen3.5-4b in this repo's defaults; override
      # this if its /v1/models endpoint exposes a different qwen-4b model id.
      # hosted_vllm (not openai/) forwards chat_template_kwargs to llama.cpp.
      POKEPILOT_LITELLM_LAN_MODEL: ${POKEPILOT_LITELLM_LAN_MODEL:-hosted_vllm/qwen3.5-4b}
    configs:
      - source: litellm_config
        target: /app/config.yaml
    deploy:
      replicas: 1

  # The GomeBoy broker owns only byte/bit routing. Keeping it separate from the
  # trader lets later real Red/Blue peers use the same transport without making
  # the broker Pokemon-aware.
  linkbroker:
    image: ${FARM_IMAGE:-pokepilot-farm:local}
    command: ["gomeboy-link-broker", "-listen", ":8765"]
    deploy:
      replicas: 1
      resources:
        reservations:
          memory: 16M
        limits:
          memory: 128M

  # Long-lived control service. POST /v1/sessions provisions one lightweight
  # virtual Cable Club peer for a run/session; it does not run another emulator.
  virtualtrader:
    image: ${FARM_IMAGE:-pokepilot-farm:local}
    command: ["gen1-trade-peer", "-http", ":8080", "-broker", "linkbroker:8765", "-rom", "/rom/pokemon_red.gb"]
    volumes:
      - ${POKEPILOT_ROM_DIR}:/rom:ro
    deploy:
      replicas: 1
      resources:
        reservations:
          memory: 32M
        limits:
          memory: 256M

  runner:
    image: ${FARM_IMAGE:-pokepilot-farm:local}
    # Give SIGTERM enough time to finish the current safe objective boundary,
    # flush the paired checkpoint, send Finish(reason=drained), and exit before
    # Swarm escalates to SIGKILL. Without this, deploys become 30s heartbeat
    # losses and unnecessarily consume recovery work (#1933).
    stop_grace_period: 60s
    # -http :8099 binds all interfaces inside the container. The runners
    # publish NO ports: they stay fully inside the swarm network, and the
    # wall proxies each runner's live screen (GET /frame?run=...) using
    # the addresses the runners report in their heartbeats. pokeui then
    # proxies that to the browser.
    # capture-every 1: the wall UI streams these frames as fast as the
    # overlay can carry a 160x144 PNG (the form's 60 fps is the emu pace;
    # a 4-frame skip made the screen look like a slideshow).
    command: ["pokepilot", "-http", ":8099", "-capture-every", "1"]
    environment:
      POKEPILOT_ORCH_URL: http://wall:8080
      # Runtime link services are private Swarm DNS names. The agent projects
      # only virtual-trader availability into its observation; endpoints never
      # enter the planner prompt.
      POKEPILOT_LINK_BROKER: linkbroker:8765
      # Advertised again after #1903: gomeboy v1.3.1 fixed the serial re-arm
      # freeze behind #1370, and TestVirtualCableClubTrade completes the ROM
      # trade end to end flat out and at paced fps.
      POKEPILOT_VIRTUAL_TRADER_URL: http://virtualtrader:8080
      # POKEPILOT_ROM_DIR is where the runner looks for every cartridge it can
      # play; POKEMON_RED_ROM names the one non-farm mode boots from.
      POKEPILOT_ROM_DIR: /rom
      POKEMON_RED_ROM: /rom/pokemon_red.gb
      # Optional S3-compatible artifact storage. Set the tuple to point at
      # RustFS/MinIO/S3; with it configured, run.gbrun is uploaded directly
      # and FinishReport carries only bucket/key/size/hash metadata.
      POKEPILOT_S3_ENDPOINT: ${POKEPILOT_S3_ENDPOINT:-}
      POKEPILOT_S3_BUCKET: ${POKEPILOT_S3_BUCKET:-}
      POKEPILOT_S3_REGION: ${POKEPILOT_S3_REGION:-us-east-1}
      POKEPILOT_S3_ACCESS_KEY: ${POKEPILOT_S3_ACCESS_KEY:-}
      POKEPILOT_S3_SECRET_KEY: ${POKEPILOT_S3_SECRET_KEY:-}
      POKEPILOT_S3_TIMEOUT: ${POKEPILOT_S3_TIMEOUT:-60s}

      # Direct CPU/LAN endpoint. This is selectable explicitly and is also the
      # safety fallback for the normal 7900 XTX route after a transport failure
      # (including the 120s primary request timeout below).
      llm_token: ${llm_token:-}
      POKEPILOT_LLM_URL: ${POKEPILOT_LLM_URL:-http://192.168.50.204:8000/v1}
      POKEPILOT_LLM_MODEL: ${POKEPILOT_LLM_MODEL:-qwen3.5-4b}
      POKEPILOT_LLM_NO_THINK: ${POKEPILOT_LLM_NO_THINK:-}
      POKEPILOT_LLM_MAX_TOKENS: ${POKEPILOT_LLM_MAX_TOKENS:-}
      POKEPILOT_LLM_TIMEOUT: ${POKEPILOT_LLM_TIMEOUT:-}

      # LiteLLM is opt-in for experiments. Empty by default means the direct
      # host routes below are used with no proxy/load-balancer in the hot path.
      POKEPILOT_LLM_GATEWAY_URL: ${POKEPILOT_LLM_GATEWAY_URL:-}
      POKEPILOT_LLM_GATEWAY_TOKEN: ${POKEPILOT_LLM_GATEWAY_TOKEN:-}
      POKEPILOT_LLM_GATEWAY_TIMEOUT: ${POKEPILOT_LLM_GATEWAY_TIMEOUT:-300s}
      POKEPILOT_LLM_GATEWAY_AUTO_MODEL: ${POKEPILOT_LLM_GATEWAY_AUTO_MODEL:-pokepilot-auto}
      POKEPILOT_LLM_GATEWAY_GPU_MODEL: ${POKEPILOT_LLM_GATEWAY_GPU_MODEL:-pokepilot-4090}
      POKEPILOT_LLM_GATEWAY_LAN_MODEL: ${POKEPILOT_LLM_GATEWAY_LAN_MODEL:-pokepilot-lan}
      POKEPILOT_LLM_GATEWAY_NO_THINK: ${POKEPILOT_LLM_GATEWAY_NO_THINK:-1}
      POKEPILOT_LLM_GATEWAY_RECOVERY_REASONING_EFFORT: ${POKEPILOT_LLM_GATEWAY_RECOVERY_REASONING_EFFORT:-off}

      # Stable run-spec values keep backwards compatibility while the physical
      # routes are now hardcoded/direct:
      #   auto    -> 7900 XTX -> CPU/LAN on transport failure or 120s timeout
      #   gpu     -> RTX 4090 only (manual selection)
      #   default -> CPU/LAN only (manual selection)
      # The 7900 keeps the historical POKEPILOT_LLM_GPU_* prefix.
      POKEPILOT_LLM_GPU_URL: ${POKEPILOT_LLM_GPU_URL:-http://192.168.50.130:8002/v1}
      POKEPILOT_LLM_GPU_MODEL: ${POKEPILOT_LLM_GPU_MODEL:-qwen3.8-27b}
      POKEPILOT_LLM_GPU_TOKEN: ${POKEPILOT_LLM_GPU_TOKEN:-}
      POKEPILOT_LLM_GPU_NO_THINK: ${POKEPILOT_LLM_GPU_NO_THINK:-1}
      POKEPILOT_LLM_GPU_MAX_TOKENS: ${POKEPILOT_LLM_GPU_MAX_TOKENS:-1024}
      POKEPILOT_LLM_GPU_TIMEOUT: ${POKEPILOT_LLM_GPU_TIMEOUT:-120s}
      POKEPILOT_LLM_GPU_RECOVERY_REASONING_EFFORT: ${POKEPILOT_LLM_GPU_RECOVERY_REASONING_EFFORT:-off}

      # Explicit 4090 route; never chosen by auto/direct fallback policy.
      POKEPILOT_LLM_4090_URL: ${POKEPILOT_LLM_4090_URL:-http://192.168.50.81:8002/v1}
      POKEPILOT_LLM_4090_MODEL: ${POKEPILOT_LLM_4090_MODEL:-pokepilot-4090}
      POKEPILOT_LLM_4090_TOKEN: ${POKEPILOT_LLM_4090_TOKEN:-}
      POKEPILOT_LLM_4090_NO_THINK: ${POKEPILOT_LLM_4090_NO_THINK:-1}
      POKEPILOT_LLM_4090_MAX_TOKENS: ${POKEPILOT_LLM_4090_MAX_TOKENS:-1024}
      POKEPILOT_LLM_4090_TIMEOUT: ${POKEPILOT_LLM_4090_TIMEOUT:-300s}
      POKEPILOT_LLM_4090_RECOVERY_REASONING_EFFORT: ${POKEPILOT_LLM_4090_RECOVERY_REASONING_EFFORT:-off}

      # Legacy direct 7900 slot retained for old local deployments.
      POKEPILOT_LLM_FALLBACK_URL: ${POKEPILOT_LLM_FALLBACK_URL:-}
      POKEPILOT_LLM_FALLBACK_MODEL: ${POKEPILOT_LLM_FALLBACK_MODEL:-}
      POKEPILOT_LLM_FALLBACK_TOKEN: ${POKEPILOT_LLM_FALLBACK_TOKEN:-}
      POKEPILOT_LLM_FALLBACK_NO_THINK: ${POKEPILOT_LLM_FALLBACK_NO_THINK:-}
      POKEPILOT_LLM_FALLBACK_MAX_TOKENS: ${POKEPILOT_LLM_FALLBACK_MAX_TOKENS:-}
      POKEPILOT_LLM_FALLBACK_TIMEOUT: ${POKEPILOT_LLM_FALLBACK_TIMEOUT:-}

      # Fast typed-decision backend (docs/TYPED-DECISIONS.md). Endpoint and
      # model come from the run's registered decision deployment; runners only
      # carry the key its token_env names (TYPESAFE_API_KEY for Jev), exactly
      # like strategist tokens. None uses it unless a run selects that
      # deployment. The DECISION_* values below are defaults for runs without
      # a registered deployment only (unset backend = off). A Jev run leased by
      # a runner without the key fails at start with "credentials are not
      # configured".
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      POKEPILOT_DECISION_BACKEND: ${POKEPILOT_DECISION_BACKEND:-}
      POKEPILOT_DECISION_MODEL: ${POKEPILOT_DECISION_MODEL:-}
      POKEPILOT_DECISION_URL: ${POKEPILOT_DECISION_URL:-}
      POKEPILOT_DECISION_TIMEOUT: ${POKEPILOT_DECISION_TIMEOUT:-}
    volumes:
      - ${POKEPILOT_ROM_DIR}:/rom:ro
    deploy:
      replicas: 2
      # 1G is a fence, not the steady-state budget. A healthy runner is 10-50MB;
      # Finish used to reload the whole checkpoint ring and spike to a few GB.
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 1G
