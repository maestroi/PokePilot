# PostgreSQL control-plane overlay for deploy/farm.yml.
#
# Deploy with both files:
#   docker stack deploy --resolve-image never \
#     -c deploy/farm.yml -c deploy/postgres.yml pokefarm
#
# Before the first deploy, label exactly one Swarm node (or a dedicated VM
# joined to the Swarm) as the database owner:
#   docker node update --label-add pokepilot.db=true <node-name>
#
# FARM_DB_DIR must point at durable storage on that node. The database is never
# scheduled on an unlabeled worker and never uses a Swarm named volume.

configs:
  postgres_control_plane_init:
    file: ./postgres/001_control_plane.sql

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    environment:
      POSTGRES_DB: ${POKEPILOT_DB_NAME:-pokepilot}
      POSTGRES_USER: ${POKEPILOT_DB_USER:-pokepilot}
      POSTGRES_PASSWORD: ${POKEPILOT_DB_PASSWORD:?POKEPILOT_DB_PASSWORD is required}
      # PostgreSQL 18 moved the image's persistent volume root to
      # /var/lib/postgresql. Keep PGDATA explicit so an image update cannot
      # silently write outside the bind mount.
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      # postgres:18-alpine writes as uid/gid 70; the host directory must match.
      - ${FARM_DB_DIR:?FARM_DB_DIR is required}:/var/lib/postgresql
    configs:
      - source: postgres_control_plane_init
        target: /docker-entrypoint-initdb.d/001_control_plane.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokepilot -d pokepilot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pokepilot.db == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 2m
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 1G

  wall:
    # Replace farm.yml's legacy state/catalog command completely. In this
    # overlay PostgreSQL is the only durable structured store; /tmp/pokewall is
    # merely a process-local compatibility/debug cache and may disappear on any
    # task rollover.
    command:
      - pokewall
      - -http
      - ":8080"
      - -dumps
      - /tmp/pokewall
      - -issues-api
      - "http://issues:8080"
      - -issues-project
      - "pokepilot"
      - -issues-ui
      - "https://github.com/${POKEPILOT_GITHUB_REPO:-maestroi/PokePilot}"
    environment:
      # The source value is intentionally credential-free because startup error
      # logs may include it. Both the model registry and PokéWall control plane
      # resolve the real DSN from POKEPILOT_DATABASE_URL inside the process.
      POKEPILOT_MODEL_REGISTRY: postgres-env://POKEPILOT_DATABASE_URL
      POKEPILOT_DATABASE_URL: ${POKEPILOT_DATABASE_URL:?POKEPILOT_DATABASE_URL is required}
      # PostgreSQL holds metadata/small structured JSON only. Checkpoint states
      # and other binary payloads are written to the same S3-compatible object
      # store used by runners/replay, so production cannot fall back to durable
      # node-local files.
      POKEPILOT_S3_ENDPOINT: ${POKEPILOT_S3_ENDPOINT:?POKEPILOT_S3_ENDPOINT is required}
      POKEPILOT_S3_BUCKET: ${POKEPILOT_S3_BUCKET:?POKEPILOT_S3_BUCKET is required}
      POKEPILOT_S3_REGION: ${POKEPILOT_S3_REGION:-us-east-1}
      POKEPILOT_S3_ACCESS_KEY: ${POKEPILOT_S3_ACCESS_KEY:?POKEPILOT_S3_ACCESS_KEY is required}
      POKEPILOT_S3_SECRET_KEY: ${POKEPILOT_S3_SECRET_KEY:?POKEPILOT_S3_SECRET_KEY is required}
      POKEPILOT_S3_TIMEOUT: ${POKEPILOT_S3_TIMEOUT:-60s}
